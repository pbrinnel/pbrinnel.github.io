<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>reign &mdash; mock</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- THE GAUNTLET MOCK. Not the game, and not meant to become the game:
         this is the endless phase on its own, booting straight into it, with
         every number on a slider. The question it exists to answer is "is
         dodging fun", and nothing here is worth keeping except the answer and
         whichever numbers end up feeling right.

         No leaderboard, no analytics, no localStorage. It cannot touch
         anything real. -->

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            color: #9a958c;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 10px;
        }
        canvas { display: block; cursor: none; touch-action: none; }

        #knobs {
            width: 268px;
            max-height: 100%;
            overflow-y: auto;
            padding: 14px 16px 18px;
            background: #0a0a09;
            border: 1px solid #201d19;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.35;
        }
        #knobs[hidden] { display: none; }
        #knobs h2 {
            margin: 0 0 4px;
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 0.22em;
            color: #6d685f;
        }
        #knobs .note { color: #4f4a43; font-style: italic; margin: 0 0 12px; }
        #knobs h3 {
            margin: 14px 0 6px;
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 0.16em;
            color: #8a8479;
            border-top: 1px solid #1a1714;
            padding-top: 9px;
        }
        #knobs label { display: block; margin: 0 0 9px; }
        #knobs .row { display: flex; justify-content: space-between; color: #9a958c; }
        #knobs .row b { color: #c9a94e; font-weight: normal; }
        #knobs input[type=range] { width: 100%; margin: 2px 0 0; accent-color: #c9a94e; }
        #knobs button {
            width: 100%;
            margin-top: 10px;
            padding: 7px 0;
            background: #090908;
            border: 1px solid #2e2a24;
            border-radius: 3px;
            color: #f2efe9;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 0.06em;
            cursor: pointer;
        }
        #knobs button:hover { border-color: #6d685f; }
        .hint {
            position: fixed;
            left: 0; right: 0; bottom: 6px;
            text-align: center;
            font-size: 11px;
            font-style: italic;
            color: #3f3b35;
            pointer-events: none;
        }
    </style>
</head>
<body>

<canvas id="stage"></canvas>

<aside id="knobs">
    <h2>GAUNTLET KNOBS</h2>
    <p class="note">everything takes effect on the next restart</p>
    <div id="sliders"></div>
    <button id="restart">restart (R)</button>
    <button id="hideKnobs">hide panel (K)</button>
</aside>

<p class="hint">move to slide &middot; click or space to throw a head &middot; K knobs &middot; R restart</p>

<script>
(() => {
    'use strict';

    const LW = 800, LH = 600;

    // ---- the shape ---------------------------------------------------------
    // lifted verbatim from brandon.html. he lies along the diagonal of the
    // source art at -34 degrees; rotate him level and his silhouette fills the
    // box below. the mask under it is his real outline, sampled off the alpha
    // channel -- which matters more here than it ever did, because in this mode
    // the outline is YOURS. the gaps in it are gaps a bullet goes through.
    const PADDLE_LEVEL = 34 * Math.PI / 180;
    const SHAPE = {
        SW: 800, SH: 602,
        RW: 1000, RH: 948,
        bx: 36, by: 382, bw: 896, bh: 316
    };
    const SHAPE_ASPECT = SHAPE.bw / SHAPE.bh;
    const MASK = [
        '......................##',
        '.................#######',
        '##........##############',
        '#######################.',
        '.######################.',
        '........###############.',
        '.........##############.',
        '..........############..',
        '...........###...####...'
    ];
    const MCOLS = 24, MROWS = 9;

    const PADDLE_ASPECT  = SHAPE.SW / SHAPE.SH;
    const BODY_LEN_PER_W = 1.1189;
    const ART_OFF_X      = 0.0291;
    const ART_OFF_Y      = 0.1052;

    const BALL_RX = 15, BALL_RY = 22;

    // ---- the knobs ---------------------------------------------------------
    // Everything that could plausibly be wrong is here rather than buried in
    // the code. `K` is the tuning group, so a whole run can be retuned without
    // reading a line of this file.
    const K = {
        kingW0:     { v: 760,  min: 300, max: 800, step: 10,   label: 'start width' },
        kingW1:     { v: 170,  min: 90,  max: 400, step: 10,   label: 'width at death’s door' },
        kingHp:     { v: 24,   min: 6,   max: 60,  step: 1,    label: 'health' },
        dmgPerHit:  { v: 2,    min: 1,   max: 8,   step: 1,    label: 'damage a head does to you' },
        shrinkHits: { v: 3,    min: 0.5, max: 20,  step: 0.5,  label: 'hits to shrink (lower = faster)' },
        iFrames:    { v: 0.70, min: 0,   max: 2,   step: 0.05, label: 'mercy after a hit (s)' },
        lives:      { v: 2,    min: 0,   max: 3,   step: 1,    label: 'lives carried in' },
        overheal:   { v: 4,    min: 0,   max: 12,  step: 1,    label: 'health per life' },

        shipsMax:   { v: 28,   min: 1,   max: 56,  step: 1,    label: 'most on the floor' },
        rampSecs:   { v: 95,   min: 15,  max: 300, step: 5,    label: 'seconds to full ferocity' },
        groupBase:  { v: 3,    min: 1,   max: 12,  step: 1,    label: 'biggest batch at the start' },
        groupDouble:{ v: 26,   min: 5,   max: 120, step: 1,    label: 'seconds for batch size to double' },
        gapMin:     { v: 3,    min: 0.5, max: 20,  step: 0.5,  label: 'shortest gap between batches (s)' },
        gapMax:     { v: 10,   min: 1,   max: 30,  step: 0.5,  label: 'longest gap between batches (s)' },
        hardSecs:   { v: 120,  min: 15,  max: 400, step: 5,    label: 'seconds until the mix is meanest' },
        fire0:      { v: 2.20, min: 0.3, max: 5,   step: 0.05, label: 'first fire gap (s)' },
        fire1:      { v: 0.55, min: 0.1, max: 3,   step: 0.05, label: 'final fire gap (s)' },
        rate0:      { v: 3,    min: 0.5, max: 40,  step: 0.5,  label: 'army‘s combined shots/sec, early' },
        rate1:      { v: 17,   min: 0.5, max: 60,  step: 0.5,  label: 'army‘s combined shots/sec, late' },
        bullet0:    { v: 250,  min: 80,  max: 700, step: 10,   label: 'first bullet speed' },
        bullet1:    { v: 430,  min: 100, max: 900, step: 10,   label: 'final bullet speed' },
        spread1At:  { v: 35,   min: 0,   max: 300, step: 5,    label: 'seconds until 3-shot spreads' },
        spread2At:  { v: 80,   min: 0,   max: 300, step: 5,    label: 'seconds until 5-shot spreads' },

        throwCool:  { v: 0.85, min: 0.1, max: 3,   step: 0.05, label: 'throw cooldown (s)' },
        throwSpeed: { v: 520,  min: 150, max: 1000,step: 10,   label: 'your head’s speed' },
        dropOdds:   { v: 0.28, min: 0,   max: 1,   step: 0.02, label: 'chance a kill floats one up' },
        spreadSecs: { v: 12,   min: 2,   max: 40,  step: 1,    label: 'SPREAD lasts (s)' },
        burstSecs:  { v: 10,   min: 2,   max: 40,  step: 1,    label: 'BURST lasts (s)' },

        ptsKill:    { v: 750,  min: 0,   max: 5000,step: 50,   label: 'points per kill' },
        ptsSec:     { v: 10,   min: 0,   max: 2000,step: 10,   label: 'points per second' },

        outroScale: { v: 1,    min: 0.3, max: 2,   step: 0.1,  label: 'ceremony length' }
    };
    const k = n => K[n].v;

    // the groups are only for the panel's benefit
    const GROUPS = [
        ['YOU',        ['kingW0', 'kingW1', 'kingHp', 'dmgPerHit', 'shrinkHits',
                        'iFrames', 'lives', 'overheal']],
        ['THE ARMY',   ['shipsMax', 'rampSecs', 'groupBase', 'groupDouble',
                        'gapMin', 'gapMax', 'hardSecs',
                        'fire0', 'fire1', 'rate0', 'rate1',
                        'bullet0', 'bullet1', 'spread1At', 'spread2At']],
        ['YOUR REPLY', ['throwCool', 'throwSpeed', 'dropOdds',
                        'spreadSecs', 'burstSecs']],
        ['SCORE',      ['ptsKill', 'ptsSec']],
        ['THE END',    ['outroScale']]
    ];

    // ---- fixed numbers -----------------------------------------------------
    const KING_Y     = 150;      // where the throne sits
    const KING_BOB   = 14;
    const KING_EDGE  = 0.28;     // how far in his centre may come, as a fraction
                                 // of the field -- he overhangs past that

    const SHIP_W     = 116;
    const SHIP_H     = SHIP_W / SHAPE_ASPECT;
    const SHIP_Y     = LH - 78;  // the front rank
    const SHIP_ROW   = 7;        // how many stand in one rank
    const SHIP_STEP  = 34;       // and how far behind it the next one sits
    const SHIP_RISE  = 0.9;      // seconds to climb into formation
    const SHIP_SWEEP = 0.55;     // rad/s of patrol
    const SHIP_DEATH = 0.45;     // how long one takes to come apart

    // How much killing one takes, and what that looks like. A hit knocks it one
    // rung DOWN the ladder, so the colour it is wearing is always how many more
    // you still owe it -- the same trick the silver bricks play in the game
    // proper, where a struck one swaps to its own worn tint rather than taking
    // a dark wash.
    //
    // Index 0 is a one-hit grunt and keeps the shadowed slate the whole army
    // used to wear. The heir's #39404a is right for a screen draining to grey;
    // on plain black an army of it is just holes.
    const SHIP_TIERS = ['#78838f', '#b9bcc4', '#9a6ec4'];
    const SHIP_TINT  = SHIP_TIERS[0];      // still the army's base look
    // the share of arrivals that are hard once the army is as mean as it gets.
    // both start at nothing, and the three-hit ones come in on a square so they
    // stay genuinely rare until well into a run.
    const TOUGH3     = 0.42;
    const TOUGH2     = 0.55;

    const BUL_R      = 9;        // head bullets, drawn small
    const THROW_R    = 13;
    const KING_TINT  = null;     // you are the photograph, like the boss was

    // your phantoms carry the sickly colour -- the boss's weapon, now yours.
    // their bullets stay the plain photograph, the way the player's ball
    // always has been. so the screen reads: pale heads are theirs, green
    // heads are yours.
    const PH_COLOR   = '#6faf3a';
    const PH_GLOW    = 0.34;
    const PH_ALPHA   = 0.62;

    // What a dead one leaves behind. Arkanoid's capsules fell into the paddle
    // at the bottom of the screen; you are at the TOP now, so they rise into
    // you instead -- the same idea seen from the throne, which is the joke this
    // whole mode is built on.
    //
    // No shout on pickup. The capsules in the game proper announce themselves
    // because catching one is the good thing that happens in an otherwise
    // uneventful rally; here the screen is already full of incident and a piece
    // of type across the middle of it is one more thing to see through.
    const DROPS = {
        S: { name: 'SPREAD', color: '#4fa9c4', secs: 'spreadSecs' },
        B: { name: 'BURST',  color: '#d2683f', secs: 'burstSecs'  }
    };
    const DROP_KEYS = Object.keys(DROPS);
    const DROP_RISE = 118;       // px/s upward. slow enough to be a decision.
    const DROP_R    = 12;
    const DROP_LIFE = 9;

    // SPREAD is spatial and BURST is temporal, so they compose rather than
    // collide: BURST decides how many volleys leave you, SPREAD decides how
    // wide each volley is. Fifteen heads with both up.
    const SPREAD_N   = 3;
    const SPREAD_ARC = 0.22;     // radians between barrels
    const BURST_N    = 5;
    const BURST_GAP  = 0.09;     // seconds between volleys

    const ABSORB_GAP  = 0.55;    // between swallowed lives
    const ABSORB_FLY  = 0.5;

    // The end is the beginning, which is the entire point of the mode. One of
    // them climbs into the space you are vacating and swells to fill it, and
    // the colour comes into him as it goes out of you -- the same ceremony you
    // got, run again, with you as the thing on the floor.
    //
    // It takes its time. Fourteen seconds is a long while to hold a screen, and
    // it is meant to be: the whole run was about how fast you could take
    // something apart, so the one thing that should not be quick is watching it
    // happen to you. Nothing here is skippable until the very end.
    //
    // The order of the beats matters. The colour goes first, then he sags, then
    // he comes apart -- and he comes apart from the boot inward, so his face is
    // the last piece on the screen. The new one is already most of the way up
    // by the time it goes.
    const OUT_HOLD    = 1.2;    // nothing moves. it has just happened.
    const OUT_WILT    = 2.9;    // sagging and draining, still in one piece
    const OUT_BREAK   = 3.4;    // the first piece leaves
    const OUT_SPAN    = 5.6;    // ...and the spread between first and last
    const OUT_GONE    = 2.4;    // how long a piece takes to fade out
    const OUT_RISE_AT = 2.6;
    const OUT_RISE    = 8.6;
    const OUT_TITLE   = 11.6;
    const OUT_STATS   = 12.6;
    const OUT_AGAIN   = 14.0;
    const OUT_LEAN    = 0.16;   // radians he sags through
    const OUT_SAG     = 18;     // ...and pixels he settles by

    // ---- canvas ------------------------------------------------------------
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const paddleImg = Object.assign(new Image(), { src: 'images/brandon/paddle.webp' });
    const ballImg   = Object.assign(new Image(), { src: 'images/brandon/ball.webp' });
    const ready = img => img.complete && img.naturalWidth > 0;

    // ---- state -------------------------------------------------------------
    let king, ships, bullets, throws, sparks, victor = null;
    let shards = [], fallW = 0, fallX = 0;
    let drops, volleys, fxS, fxB;      // what floats up, what is queued to
                                       // leave you, and what is running
    let phase, clock, runT, spawnT, score, cool, shake;
    let absorbT, absorbLeft, outroT, uiScale = 1;

    function newKing() {
        const hp = k('kingHp');
        return {
            x: LW / 2, tx: LW / 2,
            hp, hpMax: hp, hpBase: hp,     // hpBase is the bar's "normal" span
            hits: 0,                        // what his size decays off
            hurt: 0,                        // mercy timer
            flash: 0,
            grow: 0                         // extra width bought with lives
        };
    }

    function restart() {
        king = newKing();
        ships = []; bullets = []; throws = []; sparks = [];
        drops = []; volleys = []; fxS = 0; fxB = 0;
        clock = 0; runT = 0; score = 0; cool = 0; shake = 0;
        spawnT = 0;                    // the first one is already walking on
        outroT = 0; victor = null; shards = [];
        absorbLeft = k('lives');
        absorbT = ABSORB_GAP;
        phase = absorbLeft > 0 ? 'absorb' : 'play';
        // no explicit first arrival: spawnT is already 0, so the first update
        // tick that runs in 'play' walks one on. doing both put two of them on
        // the floor before anything had happened.
    }

    // ---- sprites -----------------------------------------------------------
    const SS = 3;
    const spriteCache = new Map();

    function shade(hex, t) {
        const n = parseInt(hex.slice(1), 16);
        const to = t > 0 ? [242, 239, 233] : [0, 0, 0];
        const a = Math.abs(t);
        const ch = i => {
            const c = (n >> (16 - i * 8)) & 255;
            return Math.round(c + (to[i] - c) * a);
        };
        return 'rgb(' + ch(0) + ',' + ch(1) + ',' + ch(2) + ')';
    }

    function placeShape(g, w, h, grey) {
        g.save();
        g.scale(w / SHAPE.bw, h / SHAPE.bh);
        g.translate(-SHAPE.bx, -SHAPE.by);
        g.translate(SHAPE.RW / 2, SHAPE.RH / 2);
        g.rotate(PADDLE_LEVEL);
        if (grey) g.filter = 'grayscale(1) contrast(1.1) brightness(1.95)';
        g.drawImage(paddleImg, -SHAPE.SW / 2, -SHAPE.SH / 2, SHAPE.SW, SHAPE.SH);
        g.filter = 'none';
        g.restore();
    }

    // a level brandon at a given size, tinted. baked once per key and scaled
    // at draw time -- the king's width slides continuously, so a sprite per
    // pixel of it would be hundreds of canvases.
    function shapeSprite(key, color, w, h, flat) {
        if (spriteCache.has(key)) return spriteCache.get(key);
        if (!ready(paddleImg)) return null;

        const c = document.createElement('canvas');
        c.width = Math.round(w * SS);
        c.height = Math.round(h * SS);
        const g = c.getContext('2d');
        g.scale(SS, SS);

        if (color === null) {
            placeShape(g, w, h, false);
        } else if (flat) {
            placeShape(g, w, h, false);
            g.globalCompositeOperation = 'source-in';
            g.fillStyle = color;
            g.fillRect(0, 0, w, h);
        } else {
            // he is nearly all black shirt and dark denim, so multiplying a
            // colour through him just makes mud -- lift him first, then wash
            placeShape(g, w, h, true);
            g.globalCompositeOperation = 'source-atop';
            g.globalAlpha = 0.8;
            g.fillStyle = shade(color, 0.12);
            g.fillRect(0, 0, w, h);
            g.globalAlpha = 1;
        }
        g.globalCompositeOperation = 'source-over';
        spriteCache.set(key, c);
        return c;
    }

    function headSprite(key, color, wash) {
        if (spriteCache.has(key)) return spriteCache.get(key);
        if (!ready(ballImg)) return null;
        const w = BALL_RX * 2, h = BALL_RY * 2;
        const c = document.createElement('canvas');
        c.width = Math.round(w * SS); c.height = Math.round(h * SS);
        const g = c.getContext('2d');
        g.scale(SS, SS);
        g.filter = 'grayscale(1) contrast(1.05) brightness(1.55)';
        g.drawImage(ballImg, 0, 0, w, h);
        g.filter = 'none';
        g.globalCompositeOperation = 'source-atop';
        g.globalAlpha = wash;
        g.fillStyle = color;
        g.fillRect(0, 0, w, h);
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
        spriteCache.set(key, c);
        return c;
    }

    // ---- the king ----------------------------------------------------------
    // His size is the whole arc of the mode: at 760 across an 800 field there
    // is nowhere to go, and every hit buys you room.
    //
    // It decays off HITS TAKEN rather than off the fraction of health left,
    // which is the difference between "you shrink steadily" and "the first two
    // hits carve you in half". A fraction-of-health curve is hostage to the
    // health total -- at 24 hp the opening hit is 4% of the bar and barely
    // moves him whatever exponent it is raised to. Per-hit decay does not care
    // how much health there is: the first hit is always the big one.
    //
    // 760 -> 593 -> 473 -> 387 -> 325 -> 281 at the default rate, then it
    // flattens out and the last dozen hits barely touch him. What you paid for
    // with lives goes the same way, so arriving fat is a real cost up front
    // and worth nothing by the end.
    function kingW() {
        const w0 = k('kingW0') + king.grow, w1 = k('kingW1');
        return w1 + (w0 - w1) * Math.exp(-king.hits / Math.max(0.2, k('shrinkHits')));
    }
    function kingH() { return kingW() / SHAPE_ASPECT; }
    function kingY() { return KING_Y + Math.sin(clock * 0.9) * KING_BOB; }

    // the mask test, in his own frame. the ball used to thread the gaps in his
    // outline; now the gaps are the only reason you live.
    function hitsKing(px, py) {
        const w = kingW(), h = kingH();
        const x0 = king.x - w / 2, y0 = kingY() - h / 2;
        if (px < x0 || px > x0 + w || py < y0 || py > y0 + h) return false;
        const cx = Math.min(MCOLS - 1, Math.max(0, ((px - x0) / w * MCOLS) | 0));
        const cy = Math.min(MROWS - 1, Math.max(0, ((py - y0) / h * MROWS) | 0));
        return MASK[cy][cx] === '#';
    }

    function hurtKing() {
        if (king.hurt > 0) return;
        // the HIT count is what your size decays off, and it still goes up by
        // one -- so taking heavier damage kills you sooner without changing how
        // fast you shrink. the two were never the same clock.
        king.hp -= k('dmgPerHit');
        king.hits++;
        king.hurt = k('iFrames');
        king.flash = 1;
        shake = Math.min(1, shake + 0.7);
        if (king.hp <= 0) fall();
    }

    // whoever is still standing nearest to you gets the throne. not the one
    // that landed the shot -- the one that is THERE, which is the honest
    // version of how you got it.
    function fall() {
        phase = 'outro';
        outroT = 0;
        const live = ships.filter(s => s.alive);
        const near = live.sort((a, b) =>
            Math.abs(a.x - king.x) - Math.abs(b.x - king.x))[0];
        victor = { x: near ? near.x : LW / 2, y: near ? near.y : SHIP_Y,
                   from: near || null };
        shake = 1;
        // freeze the body at the size it died at -- it must not keep shrinking
        // out from under the ceremony
        fallW = kingW();
        fallX = king.x;
        shatter();
    }

    // He comes apart along the mask -- the same 24 x 9 grid that has decided
    // what the ball could and could not hit since the first brick. The grid was
    // always his outline; at the end it is his fracture pattern.
    //
    // Each piece waits its turn, and the wait is its distance from his head:
    // the boot goes first and his face is the last thing left on the screen.
    // Rows count for more than columns in that distance so it reads as coming
    // apart from the bottom, not merely from the left.
    function shatter() {
        shards = [];
        const hu = MCOLS - 1, hv = 0;          // he lies head-up-and-right
        let far = 1;
        const cells = [];
        for (let v = 0; v < MROWS; v++) {
            for (let u = 0; u < MCOLS; u++) {
                const d = Math.hypot(u - hu, (v - hv) * 2.2);
                far = Math.max(far, d);
                cells.push({ u, v, d });
            }
        }
        for (const c of cells) {
            shards.push({
                u: c.u, v: c.v,
                wait: (1 - c.d / far) * OUT_SPAN,
                // barely any push. they are not blown off him, they give up
                vx: (c.u - hu) * 0.9 + (Math.random() - 0.5) * 14,
                vy: -4 - Math.random() * 12,
                spin: (Math.random() - 0.5) * 0.9,
                rot: 0, dx: 0, dy: 0, age: 0
            });
        }
    }

    // ---- the army ----------------------------------------------------------
    // There are no waves. There is one number that climbs the whole time you
    // are alive, and everything the army does reads off it -- how often another
    // one walks on, how fast they fire, how fast the shot travels. Nothing
    // steps, nothing announces itself, and there is no moment where a screen is
    // "cleared". It just keeps getting worse at a rate you can feel but not
    // count.
    function pressure() { return Math.min(1, runT / Math.max(1, k('rampSecs'))); }
    const ramp = (a, b) => k(a) + (k(b) - k(a)) * pressure();

    const SHIP_LO = 70, SHIP_HI = LW - 70;

    // The formation is ranks of SHIP_ROW, filling from the front and stacking
    // BACKWARDS up the screen -- so a growing army does not spread sideways
    // into a smear, it deepens, and the front of it creeps toward you. Odd
    // ranks are offset half a place so it reads as a crowd rather than a grid.
    //
    // Every ship owns a slot. A dead one frees its slot and the next arrival
    // takes the lowest free one, so holes in the front rank get filled before
    // anybody stands at the back. Nobody who is already standing ever moves,
    // which is what keeps arrivals from reading as waves.
    function slotX(slot) {
        const row = (slot / SHIP_ROW) | 0, col = slot % SHIP_ROW;
        const span = SHIP_HI - SHIP_LO;
        return SHIP_LO + span * ((col + 0.5) / SHIP_ROW)
             + (row % 2) * (span / SHIP_ROW / 2);
    }
    function slotY(slot) {
        return SHIP_Y - ((slot / SHIP_ROW) | 0) * SHIP_STEP;
    }

    // how hard the arrivals are skewing, on the same clock as how many of them
    // there are. three-hit ones arrive on a square, so they are genuinely rare
    // early and then are suddenly most of what walks on.
    function pickHp() {
        const hard = Math.min(1, runT / Math.max(1, k('hardSecs')));
        const p3 = hard * hard * TOUGH3;
        const p2 = hard * TOUGH2 * (1 - p3);
        const r = Math.random();
        return r < p3 ? 3 : r < p3 + p2 ? 2 : 1;
    }

    // They do not walk on one at a time any more. The size of a batch doubles
    // every `groupDouble` seconds off a base of `groupBase`, so it is ~1-3 at
    // the start, ~1-6 by thirty seconds, ~1-15 by a minute, and keeps going.
    // The gap before the next batch is plain random within its range -- no
    // ramp on it at all, because a REGULAR drumbeat is the thing that reads as
    // waves, and randomness is what stops you counting.
    function groupMax() {
        return Math.max(1, Math.round(
            k('groupBase') * Math.pow(2, runT / Math.max(1, k('groupDouble')))));
    }
    function nextGap() {
        return k('gapMin') + Math.random() * Math.max(0, k('gapMax') - k('gapMin'));
    }

    function addGroup() {
        const n = 1 + ((Math.random() * groupMax()) | 0);
        for (let i = 0; i < n; i++) addShip();
    }

    function addShip() {
        const used = new Set(ships.filter(s => s.alive).map(s => s.slot));
        let slot = 0;
        while (used.has(slot)) slot++;
        if (slot >= k('shipsMax')) return;          // the floor is full
        const hp = pickHp();
        ships.push({
            slot, x: slotX(slot), y: slotY(slot),
            // each on its own patrol phase and its own reach, so the line never
            // moves as one block. kept short -- they are shoulder to shoulder
            // now and a wide sway would just be everyone walking through
            // everyone else.
            amp: 12 + Math.random() * 22,
            ph: Math.random() * 6.28,
            rise: 0,
            fire: 0.6 + Math.random() * k('fire0'),
            hp, maxHp: hp, flash: 0,
            dead: 0,
            alive: true
        });
    }

    function shipFire(s) {
        const spread = runT >= k('spread2At') ? 2 : runT >= k('spread1At') ? 1 : 0;
        const speed = ramp('bullet0', 'bullet1');
        for (let i = -spread; i <= spread; i++) {
            const a = i * 0.17;
            bullets.push({
                x: s.x, y: s.y - SHIP_H * 0.3,
                vx: Math.sin(a) * speed,
                vy: -Math.cos(a) * speed,
                angle: Math.random() * 6.28,
                spin: (Math.random() - 0.5) * 9
            });
        }
    }

    // one of your heads landing. it takes a rung off, and only the last rung
    // kills -- everything else is a colour change and a flash, which is the
    // whole readability of the thing.
    function hitShip(s) {
        s.flash = 1;
        if (--s.hp > 0) return;
        killShip(s, s.x, s.y);
    }

    function killShip(s, x, y) {
        s.alive = false;
        s.dead = SHIP_DEATH;
        // a three-hit one cost you three throws, so it pays three times. this
        // is structural rather than a balance number -- the actual rate is
        // still to be set.
        score += k('ptsKill') * s.maxHp;
        // ...and it is likelier to leave something, as though each rung had
        // rolled for it separately
        if (Math.random() < 1 - Math.pow(1 - k('dropOdds'), s.maxHp)) {
            drops.push({
                x, y: y - SHIP_H * 0.3,
                kind: DROP_KEYS[(Math.random() * DROP_KEYS.length) | 0],
                angle: Math.random() * 6.28,
                spin: (Math.random() - 0.5) * 3,
                life: DROP_LIFE
            });
        }
        for (let i = 0; i < 9; i++) {
            const a = Math.random() * 6.28, v = 60 + Math.random() * 150;
            sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
        }
    }

    // ---- your reply --------------------------------------------------------
    // straight down, from wherever you are. you only move on one axis, so
    // lining a throw up and staying out of the way are the same decision --
    // which is the whole tension of the mode.
    function throwHead() {
        if (phase !== 'play' || cool > 0) return;
        cool = k('throwCool');
        // the queue holds TIMES, not positions, so a burst fired while you are
        // sliding lays itself down across the floor behind you rather than
        // stacking in one column. moving is how you aim the back half of it.
        const n = fxB > 0 ? BURST_N : 1;
        for (let i = 0; i < n; i++) volleys.push(clock + i * BURST_GAP);
    }

    function volley() {
        const n = fxS > 0 ? SPREAD_N : 1;
        const v = k('throwSpeed');
        const y = kingY() + kingH() / 2;
        for (let i = 0; i < n; i++) {
            const a = n === 1 ? 0 : (i - (n - 1) / 2) * SPREAD_ARC;
            throws.push({
                x: king.x, y,
                vx: Math.sin(a) * v, vy: Math.cos(a) * v,
                angle: Math.random() * 6.28,
                spin: 7 * (Math.random() < 0.5 ? -1 : 1)
            });
        }
    }

    // ---- update ------------------------------------------------------------
    function update(dt) {
        clock += dt;
        if (shake > 0) shake = Math.max(0, shake - dt * 2.4);
        if (king.flash > 0) king.flash = Math.max(0, king.flash - dt * 5);
        sparks = sparks.filter(s => {
            s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 320 * dt;
            return (s.life -= dt * 1.6) > 0;
        });

        if (phase === 'outro') {
            outroT += dt;
            const step = dt / Math.max(0.1, k('outroScale'));   // the whole
                                                                // ceremony
                                                                // stretches
            const ot = outroT / Math.max(0.1, k('outroScale'));
            for (const s of shards) {
                if (ot < OUT_BREAK + s.wait) continue;
                s.age += step;
                s.dx += s.vx * step;
                s.dy += s.vy * step;
                s.vy += 26 * step;            // a sixth of real gravity. sinking.
                s.rot += s.spin * step;
            }
            return;
        }

        // the lives you did not spend, swallowed one at a time. each one is a
        // little more health and a little more of him -- paid for in the only
        // currency this game has ever had.
        if (phase === 'absorb') {
            absorbT -= dt;
            if (absorbT <= 0) {
                absorbLeft--;
                king.hpBase += 0;                    // the bar's normal span is unchanged
                king.hpMax += k('overheal');
                king.hp += k('overheal');
                king.grow += 26;
                king.flash = 1;
                absorbT = ABSORB_GAP;
                if (absorbLeft <= 0) phase = 'play';
            }
            return;
        }

        runT += dt;
        score += k('ptsSec') * dt;
        if (king.hurt > 0) king.hurt = Math.max(0, king.hurt - dt);
        if (cool > 0) cool = Math.max(0, cool - dt);

        // the king moves on one axis and has no lag on him -- he is the thing
        // that used to be unkillable, and it should feel like it.
        //
        // He may hang off the edges, exactly as the boss did on arrival. At 760
        // across an 800 field there is no honest way to keep him inside it, and
        // clamping on his half-width would pin him dead centre and unable to
        // move at all during the very stretch that is supposed to feel
        // hopeless. Hopeless is not the same as frozen: you should be shoving a
        // body that will not fit through a gap, not watching a locked sprite.
        const edge = Math.min(kingW() / 2, LW * KING_EDGE);
        king.x = Math.max(edge, Math.min(LW - edge, king.tx));

        // the next one walking on. the timer keeps running whether or not the
        // floor is full, so clearing the line buys you the time it takes them
        // to refill it and nothing else.
        if ((spawnT -= dt) <= 0) {
            spawnT = nextGap();
            addGroup();
        }

        // The army has a COMBINED rate, not a per-man one. Forty of them each
        // firing on their own clock is four hundred heads a second once the
        // spreads open up -- unreadable, unplayable, and unrenderable. Under a
        // shared budget another body makes the wall WIDER rather than the
        // screen thicker, which is the threat we actually want: not more to
        // dodge, but nowhere left that is not being covered.
        const shots = runT >= k('spread2At') ? 5 : runT >= k('spread1At') ? 3 : 1;
        const alive = ships.reduce((n, s) => n + (s.alive ? 1 : 0), 0);
        const budget = Math.max(0.1, ramp('rate0', 'rate1'));
        const gap = Math.max(ramp('fire0', 'fire1'), alive * shots / budget);

        for (const s of ships) {
            if (!s.alive) { s.dead = Math.max(0, s.dead - dt); continue; }
            if (s.flash > 0) s.flash = Math.max(0, s.flash - dt * 4);
            s.rise = Math.min(1, s.rise + dt / SHIP_RISE);
            s.ph += SHIP_SWEEP * dt;
            s.x = slotX(s.slot) + Math.sin(s.ph) * s.amp;
            s.x = Math.max(SHIP_W / 2, Math.min(LW - SHIP_W / 2, s.x));
            const rise = s.rise * s.rise * (3 - 2 * s.rise);
            s.y = slotY(s.slot) + (1 - rise) * 140;
            if (s.rise < 1) continue;                 // no firing while climbing in
            if ((s.fire -= dt) <= 0) { s.fire = gap * (0.7 + Math.random() * 0.6); shipFire(s); }
        }
        ships = ships.filter(s => s.alive || s.dead > 0);

        // their bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt; b.y += b.vy * dt; b.angle += b.spin * dt;
            if (b.y < -40 || b.x < -40 || b.x > LW + 40) { bullets.splice(i, 1); continue; }
            if (hitsKing(b.x, b.y)) {
                bullets.splice(i, 1);
                hurtKing();
            }
        }

        // anything queued whose moment has come
        while (volleys.length && clock >= volleys[0]) { volleys.shift(); volley(); }

        // what floats up out of the dead. caught on his own outline, so a huge
        // early king hoovers them up and a nearly-finished one has to go and
        // get them -- which is backwards from every other pressure in the mode,
        // and is the only thing that gets easier as you get worse off.
        for (let i = drops.length - 1; i >= 0; i--) {
            const d = drops[i];
            d.y -= DROP_RISE * dt;
            d.angle += d.spin * dt;
            if (d.y < -40 || (d.life -= dt) <= 0) { drops.splice(i, 1); continue; }
            if (hitsKing(d.x, d.y)) {
                if (d.kind === 'S') fxS = k('spreadSecs'); else fxB = k('burstSecs');
                king.flash = 0.6;
                drops.splice(i, 1);
            }
        }
        if (fxS > 0) fxS = Math.max(0, fxS - dt);
        if (fxB > 0) fxB = Math.max(0, fxB - dt);

        // yours
        for (let i = throws.length - 1; i >= 0; i--) {
            const t = throws[i];
            t.x += t.vx * dt; t.y += t.vy * dt; t.angle += t.spin * dt;
            if (t.y > LH + 40 || t.x < -40 || t.x > LW + 40) { throws.splice(i, 1); continue; }
            let gone = false;
            for (const s of ships) {
                if (!s.alive) continue;
                if (Math.abs(t.x - s.x) < SHIP_W / 2 &&
                    Math.abs(t.y - s.y) < SHIP_H / 2 + 6) {
                    hitShip(s);
                    gone = true;
                    break;
                }
            }
            if (gone) throws.splice(i, 1);
        }
    }

    // ---- drawing -----------------------------------------------------------
    function text(str, x, y, size, color, align) {
        ctx.font = size + 'px "Trebuchet MS", sans-serif';
        ctx.textAlign = align || 'left';
        ctx.fillStyle = color;
        ctx.fillText(str, x, y);
        ctx.textAlign = 'left';
    }

    function drawHead(sprite, x, y, r, angle, alpha, glowColor, glow) {
        if (glow) {
            const gr = r * 2.4;
            const grd = ctx.createRadialGradient(x, y, r * 0.2, x, y, gr);
            grd.addColorStop(0, glowColor);
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.globalAlpha = glow * alpha;
            ctx.fillStyle = grd;
            ctx.beginPath(); ctx.arc(x, y, gr, 0, 6.284); ctx.fill();
        }
        const w = r * 2, h = w * (BALL_RY / BALL_RX);
        ctx.globalAlpha = alpha;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        if (sprite) ctx.drawImage(sprite, -w / 2, -h / 2, w, h);
        else if (ready(ballImg)) ctx.drawImage(ballImg, -w / 2, -h / 2, w, h);
        ctx.restore();
        ctx.globalAlpha = 1;
    }

    // the photograph, rotated onto the diagonal, at a given width. one place,
    // because the king, his corpse and his successor are all the same drawing.
    function drawFigure(x, y, w, alpha, grey, lean) {
        if (!ready(paddleImg) || alpha <= 0.001) return;
        const artW = w / BODY_LEN_PER_W, artH = artW / PADDLE_ASPECT;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.rotate(PADDLE_LEVEL + (lean || 0));
        if (grey > 0.001) ctx.filter = 'grayscale(' + grey.toFixed(3) + ')';
        ctx.drawImage(paddleImg, -artW / 2 - ART_OFF_X * artW,
                      -artH / 2 - ART_OFF_Y * artH, artW, artH);
        ctx.filter = 'none';
        ctx.restore();
    }

    // him, level and already grey, so the pieces need no per-shard filter --
    // two hundred of those a frame is not a thing to ask a canvas for, and the
    // colour has finished leaving him before the first one lets go anyway
    function greySprite() {
        if (spriteCache.has('kingGrey')) return spriteCache.get('kingGrey');
        if (!ready(paddleImg)) return null;
        const w = 900, h = w / SHAPE_ASPECT;
        const c = document.createElement('canvas');
        c.width = Math.round(w * SS); c.height = Math.round(h * SS);
        const g = c.getContext('2d');
        g.scale(SS, SS);
        g.filter = 'grayscale(1) brightness(0.94)';
        placeShape(g, w, h, false);
        spriteCache.set('kingGrey', c);
        return c;
    }

    // The pieces of him. EVERY cell is drawn, every frame -- the ones that have
    // not let go yet are simply sitting at their own address with no drift, no
    // spin and no fade, which is indistinguishable from him being whole. So
    // there is no moment where a body is swapped for a pile, and nothing is
    // ever drawn twice.
    //
    // The sag and the lean are applied to the whole mosaic rather than to each
    // piece, so it picks up exactly where the intact drawing left off, and the
    // drift then happens in his own leaning frame.
    function drawShards(sag, lean) {
        const sp = greySprite();
        if (!sp) return;
        const w = fallW, h = w / SHAPE_ASPECT;
        const cy = KING_Y + sag;
        const x0 = fallX - w / 2, y0 = cy - h / 2;
        const cw = w / MCOLS, ch = h / MROWS;
        const sw = sp.width / MCOLS, sh = sp.height / MROWS;

        ctx.save();
        ctx.translate(fallX, cy);
        ctx.rotate(lean);
        ctx.translate(-fallX, -cy);

        for (const s of shards) {
            const a = Math.max(0, 1 - s.age / OUT_GONE);
            if (a <= 0.002) continue;
            ctx.save();
            ctx.globalAlpha = a;
            ctx.translate(x0 + (s.u + 0.5) * cw + s.dx,
                          y0 + (s.v + 0.5) * ch + s.dy);
            ctx.rotate(s.rot);
            // half a pixel of bleed each way, or the grid shows as hairlines
            // between the pieces that have not moved yet
            ctx.drawImage(sp, s.u * sw, s.v * sh, sw, sh,
                          -cw / 2 - 0.5, -ch / 2 - 0.5, cw + 1, ch + 1);
            ctx.restore();
        }
        ctx.restore();
        ctx.globalAlpha = 1;
    }

    function drawKing() {
        const w = kingW(), h = w / SHAPE_ASPECT;
        const y = kingY();
        // the mercy window reads as a flicker in his OPACITY, not a strobe --
        // a slow throb between solid and three-quarters, on one object
        const a = king.hurt > 0 ? 0.62 + 0.3 * Math.sin(clock * 13) : 1;

        if (phase === 'outro') { drawFall(); return; }
        drawFigure(king.x, y, w, a, 0, 0);

        if (king.flash > 0 && phase !== 'outro') {
            const s = shapeSprite('flash', '#f2efe9', 900, 900 / SHAPE_ASPECT, true);
            if (s) {
                ctx.globalAlpha = Math.min(1, king.flash) * 0.42;
                ctx.drawImage(s, king.x - w / 2, y - h / 2, w, h);
                ctx.globalAlpha = 1;
            }
        }
        ctx.globalAlpha = 1;
    }

    // You. The colour goes, then you sag, then you let go a piece at a time.
    // No black wash over any of it -- the screen going grey IS the death, and
    // a photograph of a man is not a thing to fade to black.
    function drawFall() {
        const ot = outroT / Math.max(0.1, k('outroScale'));
        const wilt = Math.max(0, Math.min(1, (ot - OUT_HOLD) / (OUT_WILT - OUT_HOLD)));
        const e = wilt * wilt * (3 - 2 * wilt);

        const sag = e * OUT_SAG, lean = e * OUT_LEAN;

        // still whole: the colour draining out, sagging, settling lower. drawn
        // from the photograph so the drain can be a partial grayscale -- the
        // mosaic below is already fully grey, and by the time it takes over
        // this has finished going.
        if (ot < OUT_BREAK) {
            drawFigure(fallX, KING_Y + sag, fallW, 1, e, lean);
            return;
        }
        drawShards(sag, lean);
    }

    // the successor, climbing into the space you are leaving. he arrives at the
    // width YOU started at, because that is what he inherits -- and the tint
    // comes off him as he rises, so he stops being one of a crowd and becomes
    // the photograph somewhere on the way up.
    //
    // The climb is slow on purpose, and the ease is cubic rather than
    // smoothstep so the first seconds of it are almost imperceptible. He is not
    // charging the throne. He is arriving at something already decided.
    function drawVictor() {
        const ot = outroT / Math.max(0.1, k('outroScale'));
        if (!victor || ot < OUT_RISE_AT) return;
        const raw = Math.min(1, (ot - OUT_RISE_AT) / OUT_RISE);
        const t = raw * raw * raw * (raw * (raw * 6 - 15) + 10);
        const w = SHIP_W + (k('kingW0') - SHIP_W) * t;
        const y = victor.y + (KING_Y - victor.y) * t;      // from wherever he
                                                           // was standing
        const x = victor.x + (LW / 2 - victor.x) * t;

        // the shadowed version fades out from under the lit one
        const sprite = shipSprite(victor.from ? victor.from.hp : 1);
        if (sprite && t < 1) {
            ctx.globalAlpha = 1 - t;
            ctx.drawImage(sprite, x - w / 2, y - w / SHAPE_ASPECT / 2,
                          w, w / SHAPE_ASPECT);
            ctx.globalAlpha = 1;
        }
        drawFigure(x, y, w, t, 0);
    }

    // his health bar, the same one he had, in the same place -- above the
    // throne. the overheal sits past the end of the normal span in its own
    // colour, so "more than full" is legible at a glance.
    function drawKingBar() {
        const w = kingW();
        const barW = Math.min(Math.max(w * 0.72, 260), LW - 120);
        const barX = Math.max(12, Math.min(LW - 12 - barW, king.x - barW / 2));
        const barY = Math.max(10, kingY() - kingH() / 2 - 16);
        const over = king.hpMax - king.hpBase;
        const normFrac = king.hpBase / king.hpMax;

        ctx.fillStyle = 'rgba(242,239,233,0.14)';
        ctx.fillRect(barX, barY, barW, 6);

        const hp = Math.max(0, king.hp);
        const normHp = Math.min(hp, king.hpBase);
        ctx.fillStyle = '#c4703c';
        ctx.fillRect(barX, barY, barW * normFrac * (normHp / king.hpBase), 6);

        if (over > 0 && hp > king.hpBase) {
            ctx.fillStyle = '#c9a94e';
            const x0 = barX + barW * normFrac;
            ctx.fillRect(x0, barY, barW * (1 - normFrac) * ((hp - king.hpBase) / over), 6);
        }
        // the seam, so the overheal is visibly BEYOND full rather than just
        // a longer bar
        if (over > 0) {
            ctx.fillStyle = '#0a0a09';
            ctx.fillRect(barX + barW * normFrac - 1, barY, 2, 6);
        }
    }

    // one sprite per tier, so a ship changing colour costs nothing -- it just
    // starts being drawn from a different cached canvas
    function shipSprite(hp) {
        const i = Math.max(1, Math.min(SHIP_TIERS.length, hp)) - 1;
        return shapeSprite('ship' + i, SHIP_TIERS[i], 300, 300 / SHAPE_ASPECT, false);
    }

    function drawShips() {
        // back rank first, so the ones nearer you are the ones on top
        const order = ships.slice().sort((a, b) => a.y - b.y);
        for (const s of order) {
            // the one taking the throne is drawn by drawVictor instead
            if (victor && s === victor.from) continue;
            const sprite = shipSprite(s.hp);
            if (!sprite) continue;
            const dying = !s.alive;
            const t = dying ? s.dead / SHIP_DEATH : 1;
            const w = SHIP_W * (dying ? 1 + (1 - t) * 0.4 : 1);
            const h = w / SHAPE_ASPECT;
            ctx.globalAlpha = dying ? t : 1;
            ctx.drawImage(sprite, s.x - w / 2, s.y - h / 2, w, h);
            // the same white knock the bricks give: "I hurt it", distinct from
            // the colour change that says "and there is still some left"
            if (s.flash > 0) {
                const f = shapeSprite('shipflash', '#f2efe9', 300,
                                      300 / SHAPE_ASPECT, true);
                if (f) {
                    ctx.globalAlpha = Math.min(1, s.flash) * 0.7;
                    ctx.drawImage(f, s.x - w / 2, s.y - h / 2, w, h);
                }
            }
            ctx.globalAlpha = 1;
        }
    }

    function draw() {
        ctx.clearRect(0, 0, LW, LH);
        ctx.save();
        if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * 7 * shake,
                          (Math.random() - 0.5) * 7 * shake);
        }

        // The shots that killed you clear out of the air -- frozen bullets
        // hanging over the ceremony just read as a bug. The ARMY stays exactly
        // where it is, though, and that is the whole point of the ending: they
        // are still down there, still lined up, and the only thing that has
        // changed is which brandon is on the throne for them to shoot at.
        const live = phase === 'outro'
            ? Math.max(0, 1 - Math.max(0, outroT / Math.max(0.1, k('outroScale'))
                                          - OUT_HOLD) / 1.4) : 1;

        drawShips();

        if (live > 0.01) {
            // their shots: the plain photograph, the way the player's ball
            // always was. these are the heads you used to be throwing.
            for (const b of bullets) drawHead(null, b.x, b.y, BUL_R, b.angle, 0.95 * live);

            // yours: his colour, because it is his weapon
            const ph = headSprite('phantom', PH_COLOR, 0.55);
            for (const t of throws) {
                drawHead(ph, t.x, t.y, THROW_R, t.angle, PH_ALPHA * live, PH_COLOR,
                         PH_GLOW * live);
            }

            // what the dead left, rising. a head in the effect's colour with
            // its letter on it, which is the capsules' own language upside
            // down.
            for (const d of drops) {
                const cfg = DROPS[d.kind];
                const fade = Math.min(1, d.life / 1.2);
                drawHead(headSprite('drop' + d.kind, cfg.color, 0.6),
                         d.x, d.y, DROP_R, d.angle, 0.95 * fade * live,
                         cfg.color, 0.3 * live);
                ctx.globalAlpha = fade * live;
                text(d.kind, d.x, d.y + 4, 13, '#f2efe9', 'center');
                ctx.globalAlpha = 1;
            }
        }

        drawKing();
        drawVictor();
        if (phase !== 'outro') drawKingBar();

        for (const s of sparks) {
            ctx.globalAlpha = Math.max(0, s.life) * 0.8;
            ctx.fillStyle = '#c9a94e';
            ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;

        // the lives still queued, waiting to be swallowed
        if (phase === 'absorb') {
            for (let i = 0; i < absorbLeft; i++) {
                const fly = 1 - Math.max(0, Math.min(1, absorbT / ABSORB_FLY));
                const t = i === 0 ? fly : 0;
                const x = LW / 2 - 40 + i * 40;
                const y = LH - 90 + (kingY() + 40 - (LH - 90)) * t;
                drawHead(null, x, y, 13, clock * 2, 1 - t * 0.35);
            }
        }

        ctx.restore();

        // ---- hud -----------------------------------------------------------
        const u = uiScale;
        // Score and nothing else. A wave counter, a clock and a headcount all
        // tell you where you are in a thing that is not supposed to have a
        // where -- they turn an unwinnable slide into a progress bar, and you
        // start playing the numbers instead of the screen. The screen already
        // says how bad it is: look at how many of them there are.
        text('SCORE ' + Math.floor(score), 15 * u, 27 * u, 15 * u, '#f2efe9');

        // the throw cooldown, drawn where your hands are rather than in a
        // corner -- and what is loaded into it sits directly under it as two
        // short bars rather than as a word. no reading required: the cooldown
        // is green, a live SPREAD is blue beside it, a live BURST is orange,
        // and each one shortens as it runs out.
        if (phase === 'play') {
            const cw = 90;
            const cx = king.x - cw / 2, cy = LH - 26;
            ctx.fillStyle = 'rgba(242,239,233,0.13)';
            ctx.fillRect(cx, cy, cw, 4);
            ctx.fillStyle = cool <= 0 ? PH_COLOR : '#5a6b46';
            ctx.fillRect(cx, cy, cw * (1 - cool / Math.max(0.001, k('throwCool'))), 4);

            const live2 = [];
            if (fxS > 0) live2.push([fxS / k('spreadSecs'), DROPS.S.color]);
            if (fxB > 0) live2.push([fxB / k('burstSecs'), DROPS.B.color]);
            live2.forEach(([frac, col], i) => {
                const bw2 = 42, gap2 = 6;
                const x2 = king.x - (live2.length * bw2 + (live2.length - 1) * gap2) / 2
                         + i * (bw2 + gap2);
                ctx.fillStyle = 'rgba(242,239,233,0.10)';
                ctx.fillRect(x2, cy + 8, bw2, 3);
                ctx.fillStyle = col;
                ctx.fillRect(x2, cy + 8, bw2 * Math.max(0, Math.min(1, frac)), 3);
            });
        }

        if (phase === 'absorb') {
            text('THE ONES YOU DID NOT SPEND', LW / 2, LH - 130, 15 * u, '#8a8479', 'center');
        }

        if (phase === 'outro') {
            const ot = outroT / Math.max(0.1, k('outroScale'));
            // a band rather than a full blackout, so the new one on the throne
            // stays the thing you are looking at
            const band = Math.min(1, Math.max(0, (ot - OUT_TITLE + 0.6) / 0.9));
            if (band > 0.01) {
                ctx.globalAlpha = band * 0.72;
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 360, LW, 132);
                ctx.globalAlpha = 1;
            }
            const fade = t0 => Math.min(1, Math.max(0, (ot - t0) / 1.1));
            if (ot > OUT_TITLE) {
                // not a word about thrones. the same name the game opens on,
                // over a different man, with the only punctuation that fits.
                ctx.globalAlpha = fade(OUT_TITLE);
                text('BRANDON?', LW / 2, 408, 38 * u, '#f2efe9', 'center');
                ctx.globalAlpha = 1;
            }
            if (ot > OUT_STATS) {
                ctx.globalAlpha = fade(OUT_STATS);
                text('you held it ' + runT.toFixed(1) + ' seconds   ·   score '
                     + Math.floor(score), LW / 2, 440, 15 * u, '#9a958c', 'center');
                ctx.globalAlpha = 1;
            }
            if (ot > OUT_AGAIN) {
                ctx.globalAlpha = fade(OUT_AGAIN);
                text('press R, or click', LW / 2, 472, 14 * u, '#6d685f', 'center');
                ctx.globalAlpha = 1;
            }
        }
    }

    // ---- input -------------------------------------------------------------
    // the ceremony is not skippable by the click that was already on its way
    // when you died, and not by the next four either
    function outroDone() {
        return outroT / Math.max(0.1, k('outroScale')) > OUT_AGAIN;
    }

    const onUI = e => e.target && e.target.closest && e.target.closest('#knobs');

    addEventListener('pointermove', e => {
        if (onUI(e)) return;
        const r = canvas.getBoundingClientRect();
        king.tx = (e.clientX - r.left) / r.width * LW;
    });
    addEventListener('pointerdown', e => {
        if (onUI(e)) return;
        const r = canvas.getBoundingClientRect();
        king.tx = (e.clientX - r.left) / r.width * LW;
        if (phase === 'outro') { if (outroDone()) restart(); return; }
        throwHead();
    });
    addEventListener('keydown', e => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (phase === 'outro') { if (outroDone()) restart(); }
            else throwHead();
        }
        if (e.code === 'KeyR') restart();
        if (e.code === 'KeyK') knobsEl.hidden = !knobsEl.hidden;
        if (e.code === 'ArrowLeft')  king.tx -= 40;
        if (e.code === 'ArrowRight') king.tx += 40;
    });

    // ---- the panel ---------------------------------------------------------
    const knobsEl = document.getElementById('knobs');
    const slidersEl = document.getElementById('sliders');

    for (const [title, names] of GROUPS) {
        slidersEl.appendChild(Object.assign(document.createElement('h3'),
            { textContent: title }));
        for (const name of names) {
            const cfg = K[name];
            const label = document.createElement('label');
            const row = document.createElement('div');
            row.className = 'row';
            const val = document.createElement('b');
            val.textContent = cfg.v;
            row.append(Object.assign(document.createElement('span'),
                { textContent: cfg.label }), val);
            const input = Object.assign(document.createElement('input'), {
                type: 'range', min: cfg.min, max: cfg.max, step: cfg.step, value: cfg.v
            });
            input.addEventListener('input', () => {
                cfg.v = parseFloat(input.value);
                val.textContent = cfg.v;
            });
            label.append(row, input);
            slidersEl.appendChild(label);
        }
    }
    document.getElementById('restart').addEventListener('click', restart);
    document.getElementById('hideKnobs').addEventListener('click', () => knobsEl.hidden = true);

    // ---- loop --------------------------------------------------------------
    function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        const panel = knobsEl.hidden ? 0 : knobsEl.offsetWidth + 16;
        const availW = innerWidth - 20 - panel;
        const availH = innerHeight - 40;
        const scale = Math.min(availW / LW, availH / LH, 1);
        canvas.style.width = Math.floor(LW * scale) + 'px';
        canvas.style.height = Math.floor(LH * scale) + 'px';
        canvas.width = LW * dpr;
        canvas.height = LH * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        uiScale = Math.min(2.2, Math.max(1, 13 / (15 * scale)));
    }
    addEventListener('resize', resize);
    new ResizeObserver(resize).observe(knobsEl);

    // a window onto the run, for the console. it is a mock; being able to ask
    // it what it thinks is happening is worth more than hiding the state.
    window.reign = () => ({
        phase, runT: +runT.toFixed(2), pressure: +pressure().toFixed(2),
        spawnIn: +spawnT.toFixed(2), score: Math.floor(score),
        hp: king.hp, hpMax: king.hpMax, hits: king.hits,
        w: Math.round(kingW()), x: Math.round(king.x),
        flash: +king.flash.toFixed(2), hurt: +king.hurt.toFixed(2),
        ships: ships.filter(s => s.alive).length, bullets: bullets.length,
        tiers: [1, 2, 3].map(h => ships.filter(s => s.alive && s.maxHp === h).length),
        groupMax: groupMax(),
        drops: drops.length, throws: throws.length, queued: volleys.length,
        spread: +fxS.toFixed(1), burst: +fxB.toFixed(1),
        outroT: +outroT.toFixed(2),
        ot: +(outroT / Math.max(0.1, k('outroScale'))).toFixed(2),
        fallW: Math.round(fallW), fallX: Math.round(fallX),
        shards: shards.length,
        moved: shards.filter(s => s.age > 0).length,
        greyBaked: !!spriteCache.get('kingGrey')
    });

    restart();
    resize();

    let last = performance.now();
    (function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
    })(last);
})();
</script>
</body>
</html>
