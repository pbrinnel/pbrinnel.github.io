<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Brinnel</title>

    <!-- not linked from anywhere, and kept out of search results -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <meta name="theme-color" content="#000000">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #000;
            color: #f2efe9;
            font-family: 'Trebuchet MS', sans-serif;
            padding: 20px;
        }

        #stage {
            display: block;
            background: #090908;
            border: 1px solid #2e2a24;
            border-radius: 3px;
            touch-action: none;
            cursor: none;
            max-width: 100%;
            box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.85);
        }

        .hint {
            font-size: 0.76rem;
            font-style: italic;
            color: #6d685f;
            text-align: center;
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* the id selector above outranks the browser's own [hidden] rule, so
           this has to be spelled out or hiding it would do nothing */
        #splash[hidden] { display: none; }

        #splash span {
            font-size: clamp(3rem, 17vw, 13rem);
            font-weight: bold;
            letter-spacing: -0.03em;
            line-height: 1;
            color: #f2efe9;
        }

        /* the field is 4:3, which leaves a portrait phone showing a postage
           stamp -- ask for landscape instead of shipping something unplayable */
        #rotate { display: none; }

        @media (max-width: 820px) and (orientation: portrait) {
            #stage, .hint { display: none; }

            #rotate {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 18px;
                padding: 0 32px;
                text-align: center;
                color: #9a958c;
                font-size: 1rem;
                font-style: italic;
                line-height: 1.5;
            }

            #rotate b {
                font-size: 2.4rem;
                font-style: normal;
                letter-spacing: -0.02em;
                color: #f2efe9;
            }
        }
    </style>
</head>
<body>
    <div id="splash"><span>BRANDON</span></div>

    <div id="rotate"><b>BRANDON</b>turn your phone sideways</div>

    <canvas id="stage"></canvas>
    <p class="hint">move to slide brandon &middot; click or space to serve</p>

<script>
(() => {
    'use strict';

    const LW = 800, LH = 600;

    // ---- the shape ---------------------------------------------------------
    // brandon lies along the diagonal of the source art at -34 degrees. rotate
    // him level and his silhouette occupies the box below -- that box IS the
    // brick, and the mask under it is his actual outline, sampled off the alpha
    // channel. every number here was measured from paddle.webp, not guessed.
    const PADDLE_LEVEL = 34 * Math.PI / 180;
    const SHAPE = {
        SW: 800, SH: 602,                 // source art
        RW: 1000, RH: 948,                // its bounding box once rotated level
        bx: 36, by: 382, bw: 896, bh: 316 // where he actually sits inside that
    };
    const SHAPE_ASPECT = SHAPE.bw / SHAPE.bh;     // 2.835 : 1

    // 24 x 9 occupancy grid over that box. only 52% of it is solid, which is
    // the whole point -- the ball clips his boot and threads the gaps.
    const MASK = [
        '......................##',
        '.................#######',
        '##........##############',
        '#######################.',
        '.######################.',
        '........###############.',
        '.........##############.',
        '..........############..',
        '...........###...####...'
    ];
    const MCOLS = 24, MROWS = 9;

    const PADDLE_ASPECT  = SHAPE.SW / SHAPE.SH;
    const BODY_LEN_PER_W = 1.1189;
    const ART_OFF_X      = 0.0291;
    const ART_OFF_Y      = 0.1052;
    const BALL_ASPECT    = 141 / 209;

    // ---- rules -------------------------------------------------------------
    const MARGIN     = 44;
    const GAP        = 14;
    const TOP        = 70;

    const PADDLE_W   = 160;
    const PADDLE_H   = 36;
    // he is drawn proportionally, so growing him makes him taller as well as
    // longer -- the hitbox has to grow with him or a BIG brandon would have
    // the ball passing through his chest
    const padH = () => PADDLE_H * (paddle.w / PADDLE_W);
    const PADDLE_Y   = LH - 58;
    const BALL_R     = 15;

    const BASE_SPEED = 320;
    const MAX_SPEED  = 620;
    const MAX_ANGLE  = Math.PI / 3;

    const SPIN_EDGE  = 11;
    const SPIN_SWIPE = 0.045;
    const SPIN_DECAY = 0.22;
    const SPIN_MAX   = 40;
    const ENGLISH_AT = 8;

    const JIG_BRICK  = 5;
    const JIG_NEIGH  = 0.75;
    const JIG_PADDLE = 7;
    const JIG_DECAY  = 3.4;
    const JIG_FREQ   = 15;

    // ---- capsules ----------------------------------------------------------
    // arkanoid, 1986. bricks drop a capsule you have to catch with the paddle,
    // and only one may be falling at a time -- that one-at-a-time rule was a
    // deliberate constraint in the original, and it keeps this readable too.
    // the letters are arkanoid's own: E enlarge, S slow, D disruption.
    const CAP_CHANCE = 0.14;   // per brick destroyed, if none is already falling
    const CAP_FALL   = 130;    // px per second
    const CAP_W      = 58;
    const CAP_H      = CAP_W / SHAPE_ASPECT;
    const CAP_SCORE  = 250;
    const MAX_BALLS  = 6;
    const SLOW_MUL   = 0.68;

    // `name` is shouted across the screen on pickup, `short` is the hud tag
    const CAPS = {
        E: { name: 'BIG BRANDON',   short: 'BIG',   color: '#5b8cab', secs: 10 },
        S: { name: 'SLOW BRANDON',  short: 'SLOW',  color: '#4f9d8c', secs: 8  },
        D: { name: 'MULTI-BRANDON', short: 'MULTI', color: '#e0c060', secs: 0  }  // instant
    };
    const TIMED = ['E', 'S'];
    const CALLOUT_SECS = 1.15;
    const CAP_KEYS = Object.keys(CAPS);

    const TIERS = {
        R: { pts: 70, fill: '#9e4b3c' },
        O: { pts: 50, fill: '#bd7f3f' },
        G: { pts: 30, fill: '#6f7f4e' },
        Y: { pts: 10, fill: '#c9a94e' }
    };
    // all mid-tone. nothing here darkens his face -- a damaged brick changes
    // hue rather than getting a black wash over it
    const SILVER     = '#b9bcc4';
    const SILVER_HIT = '#9c8f7d';
    const GOLD       = '#78767f';

    // ---- stages ------------------------------------------------------------
    // 7 across puts each brandon at ~90px, about two thirds of the paddle.
    // . empty   Y/G/O/R tiers   S silver, multi-hit   X gold, indestructible
    const LEVELS = [
        {   // a plain wall, one row per tier
            silverHp: 2,
            rows: ['RRRRRRR',
                   'OOOOOOO',
                   'GGGGGGG',
                   'YYYYYYY']
        },
        {   // a gold spine splits the field -- you have to work both halves
            silverHp: 2,
            rows: ['RRRRRRR',
                   'OO.X.OO',
                   'OO.X.OO',
                   'GG.X.GG',
                   '.YY.YY.']
        },
        {   // a mesh of silver, so most of it takes two passes
            silverHp: 2,
            rows: ['S.S.S.S',
                   '.R.R.R.',
                   'S.S.S.S',
                   '.O.O.O.',
                   '.G.G.G.']
        },
        {   // a cowboy hat, deliberately easy, to end on the joke
            silverHp: 2,
            rows: ['..RRR..',
                   '..RRR..',
                   '.OOOOO.',
                   'YYYYYYY',
                   '.YYYYY.']
        }
    ];

    // ---- canvas ------------------------------------------------------------
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const paddleImg = Object.assign(new Image(), { src: 'images/brandon/paddle.webp' });
    const ballImg   = Object.assign(new Image(), { src: 'images/brandon/ball.webp' });
    const ready = img => img.complete && img.naturalWidth > 0;

    // ---- state -------------------------------------------------------------
    let bricks, stage, score, best, lives, combo, phase, banner;
    let paddle, balls, popups, hits, tierSeen, bw, bh;
    let speed, capsule, fx, callout, uiScale = 1;

    function loadBest() {
        try { return parseInt(localStorage.getItem('brandon.best'), 10) || 0; }
        catch (e) { return 0; }
    }
    function saveBest() {
        try { localStorage.setItem('brandon.best', String(best)); } catch (e) { /* private mode */ }
    }

    // every ball shares one speed, so the progression stays fair once the
    // board has several of them in play
    function effSpeed() { return speed * (fx.S > 0 ? SLOW_MUL : 1); }

    function aim(b, angle) {
        const s = effSpeed();
        b.vx = Math.sin(angle) * s;
        b.vy = -Math.cos(angle) * s;
    }

    function newBall(x, y) {
        return { x, y, vx: 0, vy: 0, spin: 0, angle: 0, stuck: false, off: 0 };
    }

    function clearEffects() {
        fx = { E: 0, S: 0 };
        paddle.w = PADDLE_W;
        capsule = null;
        callout = null;
    }

    function buildStage(n) {
        const lvl = LEVELS[n];
        const cols = lvl.rows[0].length;
        bw = (LW - MARGIN * 2 - GAP * (cols - 1)) / cols;
        bh = bw / SHAPE_ASPECT;

        bricks = [];
        lvl.rows.forEach((row, r) => {
            for (let c = 0; c < cols; c++) {
                const ch = row[c];
                if (!ch || ch === '.') continue;
                const b = {
                    x: MARGIN + c * (bw + GAP),
                    y: TOP + r * (bh + GAP),
                    kind: ch, alive: true, hp: 1, maxHp: 1, flash: 0,
                    jt: 0, jnx: 0, jny: 0      // jiggle: energy, and which way
                };
                if (ch === 'S') { b.hp = b.maxHp = lvl.silverHp; }
                bricks.push(b);
            }
        });
        hits = 0;
        tierSeen = {};
        resetBall();
    }

    function resetBall() {
        speed = BASE_SPEED;
        clearEffects();
        combo = 0;
        const b = newBall(paddle.x, PADDLE_Y - padH() / 2 - BALL_R - 2);
        b.stuck = true;
        balls = [b];
        phase = 'ready';
    }

    function newGame() {
        score = 0; lives = 3; stage = 0;
        popups = [];
        buildStage(0);
        banner = '';
    }

    paddle = { x: LW / 2, prevX: LW / 2, vx: 0, w: PADDLE_W, jt: 0, tilt: 0 };
    fx = { E: 0, S: 0 };
    best = loadBest();
    newGame();

    // ---- splash ------------------------------------------------------------
    // caught on the capture phase so the dismissing click or key does not also
    // fall through and serve the ball
    const splash = document.getElementById('splash');
    function dismissSplash(e) {
        if (splash.hidden) return;
        splash.hidden = true;          // hard cut, no fade
        e.preventDefault();
        e.stopPropagation();
    }
    addEventListener('pointerdown', dismissSplash, true);
    addEventListener('keydown', dismissSplash, true);

    // ---- input -------------------------------------------------------------
    const track = e => {
        const r = canvas.getBoundingClientRect();
        paddle.x = (e.clientX - r.left) / r.width * LW;
    };
    canvas.addEventListener('pointermove', track);
    canvas.addEventListener('pointerdown', e => { track(e); action(); });
    addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); action(); }
        if (e.code === 'ArrowLeft')  paddle.x -= 34;
        if (e.code === 'ArrowRight') paddle.x += 34;
    });

    // the ball rides the paddle until you serve it
    function releaseStuck() {
        for (const b of balls) {
            if (!b.stuck) continue;
            b.stuck = false;
            const off = Math.max(-1, Math.min(1, b.off / (paddle.w / 2)));
            aim(b, off * MAX_ANGLE * 0.8 + (Math.random() * 0.2 - 0.1));
        }
    }

    function action() {
        if (phase === 'ready') {
            releaseStuck();
            phase = 'play';
        } else if (phase === 'cleared') {
            stage++;
            buildStage(stage);
            banner = '';
        } else if (phase === 'over' || phase === 'won') {
            newGame();
        }
    }

    // ---- scoring -----------------------------------------------------------
    function award(base, x, y, spin) {
        let pts = base + 0.5 * base * combo;
        const s = Math.abs(spin);
        const english = s > ENGLISH_AT;
        if (english) pts *= 1 + Math.min(s, SPIN_MAX) / SPIN_MAX * 0.5;

        pts = Math.round(pts);
        score += pts;
        if (score > best) { best = score; saveBest(); }
        popups.push({ x, y, text: '+' + pts, color: english ? '#c9a94e' : '#f2efe9', life: 1 });
        combo++;
    }

    function bumpSpeed(f) {
        speed = Math.min(speed * f, MAX_SPEED);
    }

    // ---- capsules ----------------------------------------------------------
    function maybeDropCapsule(x, y) {
        if (capsule) return;                       // only one falling at a time
        if (Math.random() > CAP_CHANCE) return;
        capsule = { x, y, kind: CAP_KEYS[(Math.random() * CAP_KEYS.length) | 0] };
    }

    function splitBalls() {
        const extra = [];
        for (const b of balls) {
            for (let k = 0; k < 2; k++) {
                if (balls.length + extra.length >= MAX_BALLS) break;
                const a = Math.atan2(b.vy, b.vx) + (k ? 0.42 : -0.42);
                const nb = newBall(b.x, b.y);
                const s = effSpeed();
                nb.vx = Math.cos(a) * s;
                nb.vy = Math.sin(a) * s;
                nb.spin = b.spin;
                extra.push(nb);
            }
        }
        balls.push(...extra);
    }

    function applyCapsule(kind) {
        const cap = CAPS[kind];
        score += CAP_SCORE;
        if (score > best) { best = score; saveBest(); }
        popups.push({ x: paddle.x, y: PADDLE_Y - 40, text: '+' + CAP_SCORE, color: cap.color, life: 1 });
        callout = { text: cap.name, color: cap.color, life: CALLOUT_SECS };

        if (kind === 'D') { splitBalls(); return; }
        fx[kind] = cap.secs;
        if (kind === 'E') paddle.w = PADDLE_W * 1.5;
    }

    // ---- bricks ------------------------------------------------------------
    function wobble(jt) { return Math.sin((1 - jt) * JIG_FREQ) * jt; }

    function kick(b, nx, ny, power) {
        if (power <= b.jt) return;          // a harder knock wins
        b.jt = power; b.jnx = nx; b.jny = ny;
    }

    // knocking one loose shoves the ones around it -- makes the wall feel
    // like a physical thing rather than a grid of independent tiles
    function shockwave(src) {
        const range = (bw + GAP) * 1.25;
        for (const o of bricks) {
            if (!o.alive || o === src) continue;
            const dx = o.x - src.x, dy = o.y - src.y;
            const d = Math.hypot(dx, dy);
            if (d > range || d < 1e-4) continue;
            kick(o, dx / d, dy / d, (1 - d / range) * JIG_NEIGH);
        }
    }

    function hitBrick(b, spin) {
        b.flash = 1;
        if (b.kind === 'X') return;

        if (b.kind === 'S') {
            if (--b.hp > 0) return;
            b.alive = false;
            shockwave(b);
            award(25 * b.maxHp, b.x + bw / 2, b.y, spin);
        } else {
            b.alive = false;
            shockwave(b);
            award(TIERS[b.kind].pts, b.x + bw / 2, b.y, spin);
            if (!tierSeen[b.kind] && (b.kind === 'O' || b.kind === 'R')) {
                tierSeen[b.kind] = true;
                bumpSpeed(1.1);
            }
        }
        maybeDropCapsule(b.x + bw / 2, b.y + bh / 2);

        if (++hits === 4 || hits === 12) bumpSpeed(1.12);
        if (!bricks.some(x => x.alive && x.kind !== 'X')) clearStage();
    }

    function clearStage() {
        const bonus = 500 * (stage + 1);
        score += bonus;
        if (score > best) { best = score; saveBest(); }
        capsule = null;
        if (stage === LEVELS.length - 1) {
            phase = 'won';
            banner = 'BRANDON WINS   +' + bonus;
        } else {
            phase = 'cleared';
            banner = 'STAGE CLEAR   +' + bonus;
        }
    }

    function loseLife() {
        lives--;
        combo = 0;
        if (lives <= 0) { phase = 'over'; banner = 'GAME OVER'; return; }
        resetBall();
    }

    // ---- collision against his outline --------------------------------------
    // average the solid mask cells the ball is touching, and bounce off the
    // line from that centroid to the ball. flat where he is flat, and properly
    // strange around his boot and the gap under his knees.
    function contact(br, x, y) {
        const cw = bw / MCOLS, chh = bh / MROWS;
        const c0 = Math.max(0, Math.floor((x - BALL_R - br.x) / cw));
        const c1 = Math.min(MCOLS - 1, Math.floor((x + BALL_R - br.x) / cw));
        const r0 = Math.max(0, Math.floor((y - BALL_R - br.y) / chh));
        const r1 = Math.min(MROWS - 1, Math.floor((y + BALL_R - br.y) / chh));

        const reach = (BALL_R + Math.max(cw, chh) * 0.5) ** 2;
        let sx = 0, sy = 0, n = 0;
        for (let r = r0; r <= r1; r++) {
            const line = MASK[r];
            for (let c = c0; c <= c1; c++) {
                if (line[c] !== '#') continue;
                const px = br.x + (c + 0.5) * cw, py = br.y + (r + 0.5) * chh;
                if ((px - x) ** 2 + (py - y) ** 2 > reach) continue;
                sx += px; sy += py; n++;
            }
        }
        return n ? { cx: sx / n, cy: sy / n } : null;
    }

    // ---- physics -----------------------------------------------------------
    // returns false if this ball drained off the bottom
    function stepBall(b, dt) {
        const r = BALL_R, halfW = paddle.w / 2, halfH = padH() / 2;
        const s = effSpeed();

        // hold the shared speed, so SLOW and the ramps apply to every ball
        const m = Math.hypot(b.vx, b.vy);
        if (m > 1e-4) { b.vx = b.vx / m * s; b.vy = b.vy / m * s; }

        b.x += b.vx * dt;
        b.y += b.vy * dt;

        if (b.x - r < 0)  { b.x = r;      b.vx =  Math.abs(b.vx); b.spin *= -0.55; }
        if (b.x + r > LW) { b.x = LW - r; b.vx = -Math.abs(b.vx); b.spin *= -0.55; }
        if (b.y - r < 0)  { b.y = r;      b.vy =  Math.abs(b.vy); b.spin *= -0.55; }
        if (b.y - r > LH) return false;

        for (const br of bricks) {
            if (!br.alive) continue;
            if (b.x + r <= br.x || b.x - r >= br.x + bw) continue;   // cheap reject
            if (b.y + r <= br.y || b.y - r >= br.y + bh) continue;

            const hit = contact(br, b.x, b.y);
            if (!hit) continue;

            let nx = b.x - hit.cx, ny = b.y - hit.cy;
            let len = Math.hypot(nx, ny);
            if (len < 1e-4) { nx = 0; ny = -1; len = 1; }
            nx /= len; ny /= len;

            const dot = b.vx * nx + b.vy * ny;
            if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
            b.x += nx * 3; b.y += ny * 3;          // nudge clear

            // his contours can flatten a bounce out to nearly horizontal, which
            // would leave the ball skating sideways forever
            if (Math.abs(b.vy) < s * 0.16) {
                b.vy = (b.vy < 0 ? -1 : 1) * s * 0.16;
                const q = Math.hypot(b.vx, b.vy) || 1;
                b.vx = b.vx / q * s; b.vy = b.vy / q * s;
            }

            kick(br, -nx, -ny, 1);       // shoved away from where the ball struck
            hitBrick(br, b.spin);
            break;
        }

        if (b.vy > 0 &&
            b.x + r > paddle.x - halfW && b.x - r < paddle.x + halfW &&
            b.y + r > PADDLE_Y - halfH && b.y - r < PADDLE_Y + halfH) {

            b.y = PADDLE_Y - halfH - r;

            const off = Math.max(-1, Math.min(1, (b.x - paddle.x) / halfW));
            aim(b, off * MAX_ANGLE);

            b.spin += off * SPIN_EDGE + paddle.vx * SPIN_SWIPE;
            b.spin = Math.max(-SPIN_MAX, Math.min(SPIN_MAX, b.spin));

            paddle.jt = 1;              // recoil, tilting toward the end he took it on
            paddle.tilt = off;

            combo = 0;                  // the run ends when it comes home
            if (++hits === 4 || hits === 12) bumpSpeed(1.12);
        }
        return true;
    }

    function update(dt) {
        const halfW = paddle.w / 2;
        paddle.x = Math.max(halfW, Math.min(LW - halfW, paddle.x));
        paddle.vx = (paddle.x - paddle.prevX) / Math.max(dt, 1e-4);
        paddle.prevX = paddle.x;

        // timed effects
        for (const k of TIMED) {
            if (fx[k] <= 0) continue;
            fx[k] = Math.max(0, fx[k] - dt);
            if (fx[k] === 0 && k === 'E') paddle.w = PADDLE_W;
        }

        for (const b of balls) if (b.stuck) { b.x = paddle.x + b.off; b.y = PADDLE_Y - padH() / 2 - BALL_R - 2; }

        if (phase === 'play') {
            const fast = Math.max(...balls.map(b => Math.hypot(b.vx, b.vy)), effSpeed());
            const steps = Math.max(1, Math.ceil(fast * dt / 7));
            for (let i = 0; i < steps && phase === 'play'; i++) {
                for (let j = balls.length - 1; j >= 0; j--) {
                    if (balls[j].stuck) continue;
                    if (!stepBall(balls[j], dt / steps)) balls.splice(j, 1);
                }
                if (balls.length === 0) { loseLife(); break; }
            }
        }

        for (const b of balls) {
            b.spin -= b.spin * SPIN_DECAY * dt;
            b.angle += b.spin * dt;
        }

        // the falling capsule
        if (capsule) {
            capsule.y += CAP_FALL * dt;
            const halfH = padH() / 2;
            if (capsule.y + CAP_H / 2 > PADDLE_Y - halfH &&
                capsule.y - CAP_H / 2 < PADDLE_Y + halfH &&
                capsule.x + CAP_W / 2 > paddle.x - halfW &&
                capsule.x - CAP_W / 2 < paddle.x + halfW) {
                applyCapsule(capsule.kind);
                capsule = null;
            } else if (capsule.y - CAP_H > LH) {
                capsule = null;
            }
        }

        for (const b of bricks) {
            if (b.flash > 0) b.flash -= dt * 6;
            if (b.jt > 0) b.jt = Math.max(0, b.jt - dt * JIG_DECAY);
        }
        if (paddle.jt > 0) paddle.jt = Math.max(0, paddle.jt - dt * JIG_DECAY);
        if (callout && (callout.life -= dt) <= 0) callout = null;
        popups = popups.filter(p => (p.life -= dt * 1.4) > 0);
    }

    // ---- drawing -----------------------------------------------------------
    const SS = 3;
    const spriteCache = new Map();

    // t > 0 lifts a colour toward the page cream, t < 0 sinks it toward black
    function shade(hex, t) {
        const n = parseInt(hex.slice(1), 16);
        const to = t > 0 ? [242, 239, 233] : [0, 0, 0];
        const k = Math.abs(t);
        const ch = i => {
            const v = (n >> (16 - i * 8)) & 255;
            return Math.round(v + (to[i] - v) * k);
        };
        return `rgb(${ch(0)},${ch(1)},${ch(2)})`;
    }

    // lay him into a w x h box, levelled, with his outline filling it exactly
    function placeShape(g, w, h, grey) {
        g.save();
        g.scale(w / SHAPE.bw, h / SHAPE.bh);
        g.translate(-SHAPE.bx, -SHAPE.by);
        g.translate(SHAPE.RW / 2, SHAPE.RH / 2);
        g.rotate(PADDLE_LEVEL);
        if (grey) g.filter = 'grayscale(1) contrast(1.1) brightness(1.95)';
        g.drawImage(paddleImg, -SHAPE.SW / 2, -SHAPE.SH / 2, SHAPE.SW, SHAPE.SH);
        g.filter = 'none';
        g.restore();
    }

    // one tinted brandon at a given size, cached. `flat` gives a solid
    // silhouette, used for the white hit flash.
    function shapeSprite(key, color, w, h, flat) {
        const k = key + '@' + Math.round(w);
        if (spriteCache.has(k)) return spriteCache.get(k);
        if (!ready(paddleImg)) return null;

        const c = document.createElement('canvas');
        c.width = Math.round(w * SS);
        c.height = Math.round(h * SS);
        const g = c.getContext('2d');
        g.scale(SS, SS);

        if (flat) {
            placeShape(g, w, h, false);
            g.globalCompositeOperation = 'source-in';
            g.fillStyle = color;
            g.fillRect(0, 0, w, h);
        } else {
            // he is nearly all black shirt and dark denim, so multiplying a
            // colour through him just makes mud. lift him to near-white first,
            // then wash the colour over only his own pixels.
            placeShape(g, w, h, true);
            g.globalCompositeOperation = 'source-atop';
            g.globalAlpha = 0.8;
            g.fillStyle = shade(color, 0.12);
            g.fillRect(0, 0, w, h);
            g.globalAlpha = 1;
        }

        g.globalCompositeOperation = 'source-over';
        spriteCache.set(k, c);
        return c;
    }

    function brickColor(kind) {
        return kind === 'X'  ? GOLD
             : kind === 'S'  ? SILVER
             : kind === 'S2' ? SILVER_HIT
             : TIERS[kind].fill;
    }

    function drawBrick(b) {
        // a struck silver brick swaps to its own worn tint, rather than taking
        // a dark wash over the top of him
        const kind = (b.kind === 'S' && b.hp < b.maxHp) ? 'S2' : b.kind;
        const sprite = shapeSprite(kind, brickColor(kind), bw, bh, false);
        if (!sprite) return;

        const o = b.jt > 0 ? wobble(b.jt) * JIG_BRICK : 0;
        const x = b.x + b.jnx * o, y = b.y + b.jny * o;
        ctx.drawImage(sprite, x, y, bw, bh);

        if (b.flash > 0) {
            const f = shapeSprite('flash', '#f2efe9', bw, bh, true);
            ctx.globalAlpha = Math.min(1, b.flash) * 0.75;
            ctx.drawImage(f, x, y, bw, bh);
            ctx.globalAlpha = 1;
        }
    }

    // the capsule is just a small brandon in the effect's colour, falling
    function drawCapsule() {
        if (!capsule) return;
        const cap = CAPS[capsule.kind];
        const sprite = shapeSprite('cap' + capsule.kind, cap.color, CAP_W, CAP_H, false);
        if (sprite) ctx.drawImage(sprite, capsule.x - CAP_W / 2, capsule.y - CAP_H / 2, CAP_W, CAP_H);
        text(capsule.kind, capsule.x, capsule.y + 5, 15, '#f2efe9', 'center');
    }

    function drawPaddle() {
        const artW = (paddle.w / BODY_LEN_PER_W);
        const artH = artW / PADDLE_ASPECT;
        const o = paddle.jt > 0 ? wobble(paddle.jt) : 0;
        ctx.save();
        ctx.translate(paddle.x, PADDLE_Y + o * JIG_PADDLE);
        ctx.rotate(PADDLE_LEVEL + o * 0.07 * (paddle.tilt || 0));
        if (ready(paddleImg)) {
            ctx.drawImage(paddleImg,
                -artW / 2 - ART_OFF_X * artW,
                -artH / 2 - ART_OFF_Y * artH, artW, artH);
        } else {
            ctx.fillStyle = '#2b2b2e';
            ctx.fillRect(-artW / 2, -artH * 0.15, artW, artH * 0.3);
        }
        ctx.restore();
    }

    function drawBall(x, y, r, angle) {
        const w = r * 2, h = w / BALL_ASPECT;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        if (ready(ballImg)) ctx.drawImage(ballImg, -w / 2, -h / 2, w, h);
        else { ctx.fillStyle = '#c8a08c'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); }
        ctx.restore();
    }

    function text(str, x, y, size, color, align) {
        ctx.fillStyle = color;
        ctx.font = size + 'px "Trebuchet MS", sans-serif';
        ctx.textAlign = align || 'left';
        ctx.fillText(str, x, y);
    }

    function draw() {
        ctx.clearRect(0, 0, LW, LH);

        for (const b of bricks) if (b.alive) drawBrick(b);
        drawCapsule();
        drawPaddle();
        if (phase !== 'over' && phase !== 'won') {
            for (const b of balls) drawBall(b.x, b.y, BALL_R, b.angle);
        }

        for (const p of popups) {
            ctx.globalAlpha = Math.min(1, p.life);
            text(p.text, p.x, p.y - 26 * (1 - p.life), 15, p.color, 'center');
            ctx.globalAlpha = 1;
        }

        const u = uiScale;

        // the pickup shout -- punches in oversized and settles as it fades,
        // in the open space between the wall and the paddle
        if (callout) {
            const k = callout.life / CALLOUT_SECS;          // 1 -> 0
            ctx.globalAlpha = Math.min(1, k * 3);           // hold, then fade out
            text(callout.text, LW / 2, 392, (34 + 10 * k) * u, callout.color, 'center');
            ctx.globalAlpha = 1;
        }

        text('SCORE ' + score, 15 * u, 27 * u, 15 * u, '#f2efe9');
        text('BEST ' + best, 15 * u, 46 * u, 13 * u, '#6d685f');

        // whatever is currently running, with its time left
        let row = 66 * u;
        for (const k of TIMED) {
            if (fx[k] <= 0) continue;
            text(CAPS[k].short + ' ' + Math.ceil(fx[k]), 15 * u, row, 12 * u, CAPS[k].color);
            row += 16 * u;
        }
        if (balls.length > 1) text(balls.length + ' BALLS', 15 * u, row, 12 * u, CAPS.D.color);

        // top centre is left empty for the combo, which is the only thing up
        // there worth looking at mid-rally
        if (combo >= 2) {
            text('x' + (1 + 0.5 * combo).toFixed(1), LW / 2, 30 * u, 17 * u, '#c9a94e', 'center');
        }
        for (let i = 0; i < lives; i++) drawBall(LW - (25 + i * 29) * u, 25 * u, 9 * u, 0);

        if (phase !== 'play') {
            const my = 424, bandH = 104 * u;
            ctx.fillStyle = 'rgba(0,0,0,0.72)';
            ctx.fillRect(0, my - bandH / 2, LW, bandH);
            const msg = phase === 'ready' ? (stage === 0 && lives === 3 && score === 0
                            ? 'BRANDON' : 'READY')
                      : banner;
            text(msg, LW / 2, my - 4 * u, 32 * u, '#f2efe9', 'center');

            const sub = phase === 'ready' ? 'tap or space to serve'
                      : phase === 'cleared' ? 'tap to continue'
                      : 'final score ' + score + '   ·   tap to play again';
            text(sub, LW / 2, my + 26 * u, 15 * u, '#9a958c', 'center');
        }
    }

    // ---- loop --------------------------------------------------------------
    function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        // fit BOTH ways -- on a phone in landscape the height is what runs out
        // first, and fitting only the width would push the paddle off-screen
        const availW = document.body.clientWidth - 24;
        const availH = innerHeight - 68;              // leaves room for the hint
        const scale = Math.min(availW / LW, availH / LH, 1);
        canvas.style.width = Math.floor(LW * scale) + 'px';
        canvas.style.height = Math.floor(LH * scale) + 'px';
        canvas.width = LW * dpr;
        canvas.height = LH * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // the whole field shrinks on a phone, which would leave the hud at
        // about 7px. draw it proportionally larger so it stays readable.
        uiScale = Math.min(2.2, Math.max(1, 13 / (15 * scale)));
    }
    addEventListener('resize', resize);
    resize();

    let last = performance.now();
    (function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.05); // clamped so tab-outs don't teleport
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
    })(last);
})();
</script>
</body>
</html>
