<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRANDON 2</title>
    <!-- unlisted, and no og: tags, like the games -->
    <meta name="robots" content="noindex, nofollow">
    <style>
        html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
        /* two on top, one centered below, all in view at once: each picture is
           4:3 and gets the smaller of half the width and half the height */
        main {
            --w: min(49vw, 64vh);
            height: 100%;
            display: grid;
            grid-template-columns: repeat(2, var(--w));
            grid-auto-rows: calc(var(--w) * 0.75);
            justify-content: center;
            align-content: center;
        }
        img { display: block; width: var(--w); height: 100%; }
        img:last-child { grid-column: 1 / 3; justify-self: center; }
    </style>
</head>
<body>
    <main>
        <img src="images/brandon2sneakpeak/shot1.png" alt="NEW BRANDON">
        <img src="images/brandon2sneakpeak/shot2.png" alt="NEW LEVELS">
        <img src="images/brandon2sneakpeak/shot3.png" alt="BRANDON 2 OUT NOW">
    </main>
</body>
</html>
