<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>phantom looks</title>
<style>
  body { margin:0; background:#000; color:#9a958c;
         font:13px "Trebuchet MS", sans-serif; padding:18px 0 26px; }
  h1 { font-size:13px; letter-spacing:.22em; color:#6d685f; font-weight:normal;
       text-align:center; margin:0 0 14px; }
  canvas { display:block; margin:0 auto; }
</style></head><body>
<h1>PHANTOM OVERLAY OPTIONS</h1>
<canvas id="c" width="1340" height="760"></canvas>
<script>
const LOOKS = [
  { key:'none',   name:'no overlay (today)', color:null,      wash:0,    glow:0    },
  { key:'sick',   name:'sickly green',       color:'#6faf3a', wash:0.55, glow:0.34 },
  { key:'blood',  name:'blood red',          color:'#b23a2c', wash:0.55, glow:0.34 },
  { key:'bruise', name:'bruise violet',      color:'#7d4fb5', wash:0.55, glow:0.34 },
  { key:'rot',    name:'bile yellow',        color:'#9aae1f', wash:0.70, glow:0.40 }
];
const BALL_RX = 15, BALL_RY = 22, PH_ALPHA = 0.45, SS = 3, SCALE = 2.6;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const img = Object.assign(new Image(), { src:'images/brandon/ball.webp' });

function sprite(look) {
  const w = BALL_RX*2, h = BALL_RY*2;
  const o = document.createElement('canvas');
  o.width = Math.round(w*SS); o.height = Math.round(h*SS);
  const g = o.getContext('2d'); g.scale(SS,SS);
  g.filter = 'grayscale(1) contrast(1.05) brightness(1.55)';
  g.drawImage(img, 0, 0, w, h);
  g.filter = 'none';
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = look.wash; g.fillStyle = look.color;
  g.fillRect(0,0,w,h);
  return o;
}

function head(look, x, y, s, alpha) {
  const w = BALL_RX*2*s, h = BALL_RY*2*s;
  if (look.glow) {
    const r = BALL_RY*1.9*s;
    const grd = ctx.createRadialGradient(x,y,BALL_RX*0.2*s,x,y,r);
    grd.addColorStop(0, look.color); grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha = look.glow * alpha/PH_ALPHA; ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  ctx.globalAlpha = alpha;
  ctx.drawImage(look.color ? sprite(look) : img, x-w/2, y-h/2, w, h);
  ctx.globalAlpha = 1;
}

img.onload = () => {
  const colW = c.width / LOOKS.length;
  LOOKS.forEach((look, i) => {
    const cx = colW*i + colW/2;
    ctx.font = '15px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f2efe9';
    ctx.fillText(look.name.toUpperCase(), cx, 32);

    // one big, for the detail
    head(look, cx, 150, SCALE, PH_ALPHA);

    // the real comparison: at game size, beside the REAL ball, which is
    // what you actually have to tell apart mid-rally
    ctx.fillStyle = '#6d685f'; ctx.font = '12px "Trebuchet MS", sans-serif';
    ctx.fillText('at game size', cx, 268);
    head(look, cx - 34, 310, 1, PH_ALPHA);
    head(look, cx + 6,  334, 1, PH_ALPHA);
    head(look, cx + 44, 300, 1, PH_ALPHA);

    ctx.fillStyle = '#6d685f';
    ctx.fillText('next to the real ball', cx, 404);
    head(look, cx - 26, 446, 1, PH_ALPHA);
    head(LOOKS[0], cx + 26, 446, 1, 1);          // the genuine article, solid

    // a drift of them, the way the barrage actually arrives
    ctx.fillStyle = '#6d685f';
    ctx.fillText('a barrage', cx, 520);
    for (let k = 0; k < 7; k++) {
      const a = k * 1.9;
      head(look, cx + Math.sin(a)*78, 600 + Math.cos(a*1.3)*52, 1, PH_ALPHA);
    }
  });
};
</script>
</body></html>
