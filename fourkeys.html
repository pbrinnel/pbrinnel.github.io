<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the field run under the notch and the home
         indicator; the padding below hands that space back where it matters -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- The codename, which is all this page says about itself anywhere: the
         title screen inside it is the real one. Every page on the site carries
         its own head, so no other page's title changes. -->
    <title>FOUR KEYS</title>

    <!-- not linked from anywhere, and kept out of search results -->
    <meta name="robots" content="noindex, nofollow">

    <!-- No og: or twitter: tags at all, unlike brandon.html. That page is
         meant to be pasted to people and has a preview built to give nothing
         away; this one is not meant to be pasted to anyone yet, and a preview
         it does not have is a preview that cannot leak. A link to it comes out
         as a bare URL. -->

    <!-- an iPhone will not give up its address bar for the Fullscreen API --
         Safari does not implement it on the phone at all. Added to the home
         screen with these, though, the page opens with no browser chrome
         whatsoever, which is the only route to a genuinely full screen there.
         Android honours the API, so it never needs this path. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Four Keys">

    <!-- his head, the one you serve, in place of the site's icon. these sit
         with the game's other art, so the site's own favicons are untouched.
         the touch icon is what a home-screen shortcut shows, so that is his
         head too. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brandon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/brandon/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brandon/apple-touch-icon.png">
    <meta name="theme-color" content="#000000">

    <!-- Every face the game draws in ships with it, from fonts/fourkeys/,
         so it is the same face on every machine: nothing depends on what a
         computer has installed or on a font service being reachable. Fira
         Sans is yours and the rest of the screen's; the others are the other
         Brandons', one each (see memory.js). The two of yours are fetched
         straight away, since the canvas draws with them from the start. -->
    <link rel="preload" href="fonts/fourkeys/fira-sans-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/fourkeys/fira-sans-700.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        @font-face { font-family: 'Fira Sans'; font-weight: 400; font-display: block;
                     src: url('fonts/fourkeys/fira-sans-400.woff2') format('woff2'); }
        @font-face { font-family: 'Fira Sans'; font-weight: 700; font-display: block;
                     src: url('fonts/fourkeys/fira-sans-700.woff2') format('woff2'); }
        @font-face { font-family: 'Fira Sans'; font-weight: 400; font-style: italic; font-display: block;
                     src: url('fonts/fourkeys/fira-sans-400-italic.woff2') format('woff2'); }
        @font-face { font-family: 'Cinzel Decorative'; font-weight: 700; font-display: block;
                     src: url('fonts/fourkeys/cinzel-decorative-700.woff2') format('woff2'); }
        @font-face { font-family: 'IM Fell English SC'; font-weight: 400; font-display: block;
                     src: url('fonts/fourkeys/im-fell-english-sc-400.woff2') format('woff2'); }
        @font-face { font-family: 'Uncial Antiqua'; font-weight: 400; font-display: block;
                     src: url('fonts/fourkeys/uncial-antiqua-400.woff2') format('woff2'); }
        @font-face { font-family: 'UnifrakturMaguntia'; font-weight: 400; font-display: block;
                     src: url('fonts/fourkeys/unifraktur-maguntia-400.woff2') format('woff2'); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            background: #000;
            /* safari inflates text of its own accord in landscape, which was
               pushing the hint line taller and stealing it back off the field */
            -webkit-text-size-adjust: 100%;
            /* body's copies of these only reach the viewport while html leaves
               them alone, so say it in both places and stop guessing */
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            /* svh, not vh -- same reason as cardsforcowboys (see its
               css/theme.css): iOS pins `vh` to the LARGE viewport, the one with
               the chrome already retracted, so 100vh is about a toolbar taller
               than what you can actually see and the bottom of the field --
               where brandon stands -- ends up under the ribbon.
               svh rather than dvh on purpose, too: dvh tracks the ribbon as it
               slides away, and every one of those changes would re-scale the
               field mid-rally. svh is the stable, conservative height, and
               fullscreen makes the two identical anyway. Keep both lines; the
               vh fallback covers pre-iOS-15.4 / pre-Chrome-108. */
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #000;
            color: #f2efe9;
            font-family: 'Fira Sans', 'Trebuchet MS', sans-serif;
            /* the notch and the home indicator sit inside the viewport now that
               it is cover-fit, so keep clear of them -- but only by as much as
               the device actually asks for */
            padding: 20px max(20px, env(safe-area-inset-right))
                     max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));

            /* nothing here scrolls, so a drag that runs past the edge of the
               field should not rubber-band the page or pull down a refresh */
            overflow: hidden;
            overscroll-behavior: none;
            /* kills double-tap-to-zoom. the canvas already had its own
               touch-action, so taps ON the field were always safe -- but the
               splash and the black margins either side were not, and those
               margins now steer him, so they are somewhere you tap in earnest.
               pinch zoom is deliberately left alone: nothing here needs a whole
               gesture taken away from someone who wants a closer look. */
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #stage {
            display: block;
            background: #090908;
            border: 1px solid #2e2a24;
            border-radius: 3px;
            touch-action: none;
            cursor: none;
            max-width: 100%;
            box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.85);
        }

        .hint {
            font-size: 0.76rem;
            font-style: italic;
            color: #6d685f;
            text-align: center;
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* the id selector above outranks the browser's own [hidden] rule, so
           this has to be spelled out or hiding it would do nothing */
        #splash[hidden] { display: none; }

        /* shrink-wrapped to the title, so the subtitle has its width to match */
        #splash .title {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        #splash span {
            font-size: clamp(3rem, 17vw, 13rem);
            font-weight: bold;
            letter-spacing: -0.03em;
            line-height: 1;
            color: #f2efe9;
        }

        /* hollow, so the number is the one thing on the screen that isn't
           solid; stroke under the fill keeps the stroke from eating the glyph */
        #splash span b {
            color: #000;
            -webkit-text-stroke: 0.035em #f2efe9;
            paint-order: stroke fill;
        }

        /* faded out at both ends rather than cut off; fitSubtitle sets its
           width and the space above and below it */
        #splash hr {
            height: 1px;
            margin: 0 auto;
            border: 0;
            background: linear-gradient(to right, transparent, #8a857c 30%, #8a857c 70%, transparent);
        }

        /* this is its size before fitSubtitle stretches it to the title */
        #splash small {
            display: block;
            font-size: clamp(0.7rem, 1.6vw, 1rem);
            line-height: 1;
            white-space: nowrap;
            transform-origin: left;
            color: #8a857c;
        }

        /* stage select, unlocked with the konami code or ?debug */
        #debug {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.92);
        }

        #debug[hidden] { display: none; }

        /* keys, paddles and memories side by side, a column each: in one
           column they stand taller than the screen */
        #debug .cols {
            display: flex;
            gap: 28px;
            align-items: flex-start;
            justify-content: center;
            max-height: calc(100vh - 120px);
        }
        #debug .col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #debug .col p { max-width: 210px; text-align: center; }

        #debug h2 {
            font-size: 0.78rem;
            font-weight: normal;
            letter-spacing: 0.22em;
            color: #6d685f;
        }

        #debug button {
            width: 210px;
            padding: 9px 0;
            background: #090908;
            border: 1px solid #2e2a24;
            border-radius: 3px;
            color: #f2efe9;
            font-family: inherit;
            font-size: 0.92rem;
            letter-spacing: 0.06em;
            cursor: pointer;
        }

        #debug button:hover { border-color: #6d685f; }

        /* forgetting everything you have: small, in a corner well away from
           the keys and the paddles, and only a long hold sets it off -- see
           DBG_WIPE_HOLD. out of the column, it takes no room from them on a
           short screen. */
        #debug button.wipe {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top, 0px));
            right: calc(14px + env(safe-area-inset-right, 0px));
            width: auto;
            padding: 6px 0;
            border: 0;
            border-radius: 0;
            /* the hold's progress, an underline drawn across as it goes */
            background: linear-gradient(#9a958c, #9a958c) left bottom / 0 1px no-repeat;
            font-size: 0.72rem;
            font-style: italic;
            letter-spacing: normal;
            color: #4a453e;
            /* a long press on a phone would otherwise select the words, raise
               the browser's own menu or be taken for a gesture, and any of
               those ends the hold */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        /* the duration is DBG_WIPE_HOLD, set on the element as a hold starts */
        #debug button.wipe.holding {
            background-size: 100% 1px;
            transition-property: background-size;
            transition-timing-function: linear;
            color: #9a958c;
        }

        #debug p {
            margin-top: 6px;
            font-size: 0.72rem;
            font-style: italic;
            color: #4a453e;
        }

        /* a landscape phone is about 390px tall and the field scales off the
           height, so every pixel of page furniture costs real playfield. the
           hint is a mouse instruction and there is no mouse down here. */
        @media (max-height: 560px) {
            body {
                gap: 0;
                /* vertically, give back exactly what the hardware asks for and
                   not one pixel more -- in landscape that is the home indicator
                   at the bottom and usually nothing at the top. the 20px either
                   side stays, since width is never the binding constraint on a
                   screen this shape. */
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .hint { display: none; }
            /* at this size the screen's own edge is the border */
            #stage { border-color: transparent; }
        }

        /* a landscape phone is short: the columns tighten up, and the
           buttons with them */
        @media (max-height: 560px) and (orientation: landscape) {
            #debug { gap: 8px; }
            #debug .cols { gap: 16px; }
            #debug .col { gap: 5px; }
            #debug button { width: 170px; padding: 5px 0; font-size: 0.8rem; }
        }

        /* A phone held upright. The field is 4:3, so it runs the full width,
           pinned to the top, and everything under it is the thumb pad: a finger
           there steers him from under the field instead of covering it, and
           the field up top keeps the hand holding the phone clear of it.
           Input is on the window already, so the pad listens to nothing; it
           only shows where he is (padShow in engine.js).
           700px is the phone/tablet line: an iPad in portrait shows the field
           at nearly full size and has no need of a pad. The same query is
           PORTRAIT_PAD in engine.js, and the two must match. */
        #pad { display: none; }

        @media (max-width: 700px) and (orientation: portrait) {
            body {
                justify-content: flex-start;
                gap: 0;
                /* the field edge to edge: width is the binding side here */
                padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                         env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
            }
            #stage { border-color: transparent; border-radius: 0; }
            /* the line goes between the field and the pad, not under the pad:
               it is the only thing telling a phone how to walk him. padding,
               not margin, since resize() measures its offsetHeight */
            .hint { order: 1; padding: 8px 16px 0; }
            #pad { order: 2; }

            #pad {
                display: block;
                position: relative;
                flex: 1;
                align-self: stretch;
                /* resize() keeps this much clear below the field */
                min-height: 150px;
                touch-action: none;
                -webkit-tap-highlight-color: transparent;
            }

            /* the rail, low down where a thumb rests holding the phone */
            #pad::before {
                content: '';
                position: absolute;
                left: 24px;
                right: 24px;
                bottom: 28%;
                height: 1px;
                background: #2e2a24;
            }

            /* stands under whoever you are steering */
            #pad i {
                position: absolute;
                left: -30px;
                bottom: calc(28% - 17px);
                width: 60px;
                height: 34px;
                border: 1px solid #4a453e;
                border-radius: 17px;
                background: #090908;
                transition: border-color 0.12s, background-color 0.12s;
            }
            #pad.down i { border-color: #9a958c; background: #1a1815; }

            /* the stage menu, three columns side by side, will not go across
               a phone this way up: one column, scrolled */
            #debug .cols {
                flex-direction: column;
                align-items: center;
                /* centred, the top of an overflowing column is out of reach */
                justify-content: flex-start;
                overflow-y: auto;
                touch-action: pan-y;
            }
        }
    </style>
</head>
<body>
    <div id="splash"><div class="title"><span>BRANDON <b>2</b></span><hr><small>BRANDON TO BRANDON</small></div></div>
    <script>
    // Stretches the subtitle to SUB_WIDTH of the title's width, centred under
    // it: taller first, up to SUB_MAX_GROW, then wider letters, up to
    // SUB_MAX_WIDEN, and letter spacing for whatever is left. The rule between
    // them sits RULE_GAP (of the title's size) from the letters on each side.
    (function fitSubtitle() {
        const SUB_WIDTH = 0.9;
        const SUB_MAX_GROW = 2;
        const SUB_MAX_WIDEN = 1.5;
        const RULE_GAP = 0.12;
        const title = document.querySelector('#splash span');
        const sub = document.querySelector('#splash small');
        const rule = document.querySelector('#splash hr');
        // the rule splits the difference between the two widths
        rule.style.width = (1 + SUB_WIDTH) / 2 * 100 + '%';
        const measure = document.createElement('canvas').getContext('2d');
        // where the capitals' ink starts and ends inside an element's line
        // box, which with line-height 1 is not its edges: the title's box
        // has room below for descenders it doesn't have
        function ink(el) {
            const cs = getComputedStyle(el);
            measure.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
            const m = measure.measureText(el.textContent);
            const size = parseFloat(cs.fontSize);
            const baseline = (size - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2
                + m.fontBoundingBoxAscent;
            return { top: baseline - m.actualBoundingBoxAscent,
                     below: size - baseline - m.actualBoundingBoxDescent };
        }
        function fit() {
            sub.style.cssText = '';
            const base = parseFloat(getComputedStyle(sub).fontSize);
            const full = title.getBoundingClientRect().width;
            const target = full * SUB_WIDTH;
            const natural = sub.getBoundingClientRect().width;
            const grow = Math.min(SUB_MAX_GROW, target / natural);
            const width = natural * grow;
            const widen = Math.max(1, Math.min(SUB_MAX_WIDEN, target / width));
            // the last letter's spacing is cancelled by the margin, so only
            // the gaps between letters count
            const gap = (target / widen - width) / (sub.textContent.length - 1);
            sub.style.fontSize = base * grow + 'px';
            sub.style.letterSpacing = gap + 'px';
            sub.style.marginRight = -gap + 'px';
            sub.style.marginLeft = (full - target) / 2 + 'px';
            sub.style.transform = 'scaleX(' + widen + ')';
            const space = parseFloat(getComputedStyle(title).fontSize) * RULE_GAP;
            rule.style.marginTop = space - ink(title).below + 'px';
            rule.style.marginBottom = space - ink(sub).top + 'px';
        }
        fit();
        document.fonts.ready.then(fit);
        addEventListener('resize', fit);
    })();
    </script>

    <div id="debug" hidden><h2>STAGE SELECT</h2></div>

    <canvas id="stage"></canvas>
    <div id="pad" aria-hidden="true"><i></i></div>
    <p class="hint">move to slide brandon &middot; hold to walk him</p>

<!-- The game, in load order, and the order matters.
     Every one of these is a plain script, so they all share one scope: what a
     file declares at its top level the next one can see. The runtime and the
     modules go first because the engine's setup, at the bottom of engine.js,
     calls into them; start.js goes last because it opens the town, and the
     town is one of the modules.

     ?v= is a cache-buster. GitHub Pages holds a page for ten minutes, so a
     deploy that changes two of these can otherwise reach someone as one new
     file and one old one. Bump all of them together, every deploy. -->
<script>
// fourkeys.html?reset forgets this browser's progress and paddle. It is here,
// ahead of every game file, so it still works when a save stops the game from
// loading far enough to reach SETTINGS or the debug menu. It asks first,
// because it is a link, and a link can be passed on. The two keys are
// MENU_KEY and MENU_PAD_KEY in menu.js; initials are left alone.
if (new URLSearchParams(location.search).has('reset')) {
    if (confirm('Forget all progress on this device, and start again from the beginning?')) {
        try {
            localStorage.removeItem('brandon-metalab.progress');
            localStorage.removeItem('brandon2.paddle');
        } catch (e) { /* a private window has nothing kept to forget */ }
    }
    history.replaceState(null, '', location.pathname);
}
</script>
